<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>보배드림 댓글 UX 시안 허브</title>
<style>
:root{--bg:#f5f6f8;--ink:#15181d;--muted:#737b86;--line:#e4e7ec;--blue:#1264c4;--red:#ff6154;--green:#119c66}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;-webkit-font-smoothing:antialiased}.app{width:100%;min-height:100dvh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:30;background:rgba(245,246,248,.97);backdrop-filter:blur(12px);padding:10px 12px 9px;border-bottom:1px solid rgba(228,231,236,.9)}.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px}.titleWrap{min-width:0}h1{font-size:19px;line-height:1.18;letter-spacing:-.04em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:7px;overflow:auto;padding:10px 0 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap;color:#4b5563;font-size:12.5px;font-weight:850}.tab.on{border-color:#bfd7fa;background:#f3f8ff;color:var(--blue)}.panel{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}.panelTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-size:16px;line-height:1.25;font-weight:900;letter-spacing:-.035em}.desc{margin:4px 0 0;color:#5f6874;font-size:12.5px;line-height:1.42;word-break:keep-all}.pill{display:inline-flex;align-items:center;height:25px;border-radius:999px;padding:0 8px;background:#f0fbf6;color:var(--green);font-size:11.5px;font-weight:900;white-space:nowrap}.meta{display:flex;gap:6px;overflow:auto;margin-top:9px}.metric{background:#f7f8fa;border:1px solid #edf0f4;border-radius:11px;padding:7px 9px;min-width:76px}.metric b{display:block;font-size:13px;line-height:16px}.metric span{display:block;margin-top:2px;color:#7b838d;font-size:10.5px;font-weight:700}.actions{display:flex;gap:7px;overflow:auto;margin-top:9px}.btn{height:34px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 11px;font-size:12.5px;font-weight:900;color:#3f4752;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.warn{background:#fff6f5;border-color:#ffd1cc;color:#d8463b}.screen{flex:1;min-height:0;background:#fff;border-top:1px solid var(--line)}.preview{width:100%;height:100%;min-height:calc(100dvh - 238px);border:0;background:#fff;display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 12px 14px;background:var(--bg);border-top:1px solid var(--line)}.card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px;text-decoration:none;color:inherit}.card b{display:block;font-size:13.5px;letter-spacing:-.02em}.card span{display:block;margin-top:4px;color:#707986;font-size:11.5px;line-height:1.35}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;border-radius:999px;padding:10px 14px;font-size:12.5px;font-weight:800;transition:.18s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:560px){.top{padding-left:10px;padding-right:10px}.panel{padding-left:10px;padding-right:10px}.grid{grid-template-columns:1fr;padding-left:10px;padding-right:10px}.preview{min-height:calc(100dvh - 232px)}.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><div class="logo">보</div><div class="titleWrap"><h1>댓글 UX 시안 허브</h1><p class="sub">폰 목업 없이 실제 화면 크기로 미리보기</p></div></div>
    <nav id="tabs" class="controls"></nav>
  </header>
  <section class="panel">
    <div class="panelTop"><div><div id="name" class="name"></div><p id="desc" class="desc"></p></div><span class="pill">실제 화면</span></div>
    <div id="meta" class="meta"></div>
    <div class="actions"><a id="open" class="btn primary" target="_self">전체 화면 열기</a><button id="reload" class="btn">새로고침</button><button id="copy" class="btn">주소 복사</button><a id="raw" class="btn warn" target="_blank" rel="noopener">GitHub</a></div>
  </section>
  <section class="screen"><iframe id="preview" class="preview" title="댓글 시안 실제 화면 미리보기"></iframe></section>
  <section class="grid" id="quick"></section>
</main>
<div id="toast" class="toast">복사됨</div>
<script>
const version=Date.now();
const demos=[
  {id:'depth2',tab:'2뎁스',name:'스레드 2뎁스 · 직접 보기',file:'depth-viewer.html?mode=t2',github:'depth-viewer.html',desc:'원댓글 아래 2뎁스 답글 구조입니다. 답글 접기/펼치기와 노드별 라인 위치를 바로 확인합니다.',metrics:[['2단계','댓글 깊이'],['24px','전 뎁스 프사'],['동작','접기/펼치기']]},
  {id:'depth3',tab:'3뎁스',name:'스레드 3뎁스 · 직접 보기',file:'depth-viewer.html?mode=t3',github:'depth-viewer.html',desc:'대댓글의 하위 답글까지 노드별로 접고 펼치는 구조입니다. Reddit/Product Hunt식 라인 복잡도를 확인합니다.',metrics:[['3단계','댓글 깊이'],['노드별','−/+ 토글'],['동작','하위 묶음 접기']]},
  {id:'depth4',tab:'4뎁스',name:'유튜브 4뎁스 · 직접 보기',file:'depth-viewer.html?mode=yt',github:'depth-viewer.html',desc:'유튜브형 4뎁스 댓글 시안입니다. 깊은 답글에서 들여쓰기와 본문 너비가 유지되는지 확인합니다.',metrics:[['4단계','댓글 깊이'],['동일','하위 프사'],['확인','들여쓰기']]},
  {id:'depth5',tab:'5단계',name:'5단계 테스트 · 직접 보기',file:'depth-viewer.html?mode=d5',github:'depth-viewer.html',desc:'5단계까지 깊어졌을 때 스레드선과 노드 토글이 얼마나 복잡해지는지 보는 실험 시안입니다.',metrics:[['5단계','댓글 깊이'],['라인축','복잡성 확인'],['동작','개별 노드 토글']]},
  {id:'phmass',tab:'PH 대량',name:'PH 대량 댓글 · 직접 보기',file:'depth-viewer.html?mode=ph',github:'depth-viewer.html',desc:'Product Hunt식 대량 댓글 배치를 차량 토론 시나리오로 테스트합니다. 스캔 속도와 라인 피로도를 확인합니다.',metrics:[['386개','대량 댓글'],['PH식','노드 라인'],['테스트','스캔 UX']]},
  {id:'xianyu',tab:'시엔위',name:'시엔위 2뎁스 시간형',file:'xianyu-2depth-time-v1.html',github:'xianyu-2depth-time-v1.html',desc:'시엔위처럼 세로 라인 없는 피드형 댓글, 시간·지역·답글 메타, 답글 상세 화면 진입을 테스트합니다.',metrics:[['100개','가상 댓글'],['30/24px','1·2뎁스 프사'],['상세화면','답글 보기']]},
  {id:'facebook',tab:'페이스북',name:'페이스북 별도 시안',file:'facebook-comments-v1.html',github:'facebook-comments-v1.html',desc:'페이스북 하단 댓글 시트, 답글 보기/닫기, 우측 좋아요·싫어요 액션을 테스트합니다.',metrics:[['80개','가상 댓글'],['48/32px','1·2뎁스 프사'],['인라인','답글 펼침']]},
  {id:'youtubeStandalone',tab:'유튜브 별도',name:'유튜브 별도 시안',file:'youtube-threads-equal-avatar.html',github:'youtube-threads-equal-avatar.html',desc:'기존 유튜브형 별도 파일입니다. 댓글 바텀시트와 4뎁스 답글 구성을 직접 확인합니다.',metrics:[['4단계','댓글 깊이'],['별도','유튜브 UI'],['동작','답글 구조']]},
  {id:'stress',tab:'스트레스',name:'댓글 스트레스 테스트',file:'stress.html',github:'stress.html',desc:'많은 댓글과 깊은 스레드가 한 화면에서 얼마나 복잡해지는지 확인하는 대량 테스트 페이지입니다.',metrics:[['대량','댓글'],['복잡도','라인 확인'],['UX','스캔 테스트']]}
];
const $=s=>document.querySelector(s);
function withVersion(path,id){const sep=path.includes('?')?'&':'?';return `./${path}${sep}v=${id}-${version}`}
function url(d){return withVersion(d.file,d.id)}
function githubUrl(d){return `https://github.com/bobaekimboae/comment-depth-comparison/blob/main/${d.github}`}
function renderTabs(active){$('#tabs').innerHTML=demos.map(d=>`<button class="tab ${d.id===active.id?'on':''}" data-id="${d.id}">${d.tab}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setDemo(b.dataset.id));}
function setDemo(id){const d=demos.find(x=>x.id===id)||demos[0];renderTabs(d);$('#name').textContent=d.name;$('#desc').textContent=d.desc;$('#meta').innerHTML=d.metrics.map(m=>`<div class="metric"><b>${m[0]}</b><span>${m[1]}</span></div>`).join('');$('#open').href=url(d);$('#raw').href=githubUrl(d);$('#preview').src=url(d);history.replaceState(null,'',`#${d.id}`)}
$('#reload').onclick=()=>{const d=demos.find(x=>x.id===location.hash.replace('#',''))||demos[0];$('#preview').src=withVersion(d.file,'reload-'+Date.now())};
$('#copy').onclick=async()=>{const link=$('#open').href;try{await navigator.clipboard.writeText(link);showToast('주소 복사됨')}catch(e){showToast(link)}};
function showToast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}
$('#quick').innerHTML=demos.map(d=>`<a class="card" href="${url(d)}"><b>${d.name}</b><span>${d.desc}</span></a>`).join('');
setDemo(location.hash.replace('#','')||'depth2');
</script>
</body>
</html>
