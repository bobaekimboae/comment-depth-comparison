<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>보배드림 댓글 UX 시안 허브</title><style>:root{--bg:#f5f6f8;--ink:#15181d;--muted:#737b86;--line:#e4e7ec;--blue:#1264c4;--red:#ff6154;--green:#119c66}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;-webkit-font-smoothing:antialiased}body.lock{overflow:hidden}.app{width:100%;min-height:100dvh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:30;background:rgba(245,246,248,.97);backdrop-filter:blur(12px);padding:10px 12px 9px;border-bottom:1px solid rgba(228,231,236,.9)}.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px}.titleWrap{min-width:0}h1{font-size:19px;line-height:1.18;letter-spacing:-.04em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:7px;overflow:auto;padding:10px 0 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap;color:#4b5563;font-size:12.5px;font-weight:850}.tab.on{border-color:#bfd7fa;background:#f3f8ff;color:var(--blue)}.panel{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}.panelTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-size:16px;line-height:1.25;font-weight:900;letter-spacing:-.035em}.desc{margin:4px 0 0;color:#5f6874;font-size:12.5px;line-height:1.42;word-break:keep-all}.pill{display:inline-flex;align-items:center;height:25px;border-radius:999px;padding:0 8px;background:#f0fbf6;color:var(--green);font-size:11.5px;font-weight:900;white-space:nowrap}.meta{display:flex;gap:6px;overflow:auto;margin-top:9px}.metric{background:#f7f8fa;border:1px solid #edf0f4;border-radius:11px;padding:7px 9px;min-width:76px}.metric b{display:block;font-size:13px;line-height:16px}.metric span{display:block;margin-top:2px;color:#7b838d;font-size:10.5px;font-weight:700}.actions{display:flex;gap:7px;overflow:auto;margin-top:9px}.btn{height:34px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 11px;font-size:12.5px;font-weight:900;color:#3f4752;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.warn{background:#fff6f5;border-color:#ffd1cc;color:#d8463b}.screen{flex:1;min-height:0;background:#fff;border-top:1px solid var(--line)}.preview{width:100%;height:100%;min-height:calc(100dvh - 238px);border:0;background:#fff;display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 12px 14px;background:var(--bg);border-top:1px solid var(--line)}.card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px;text-decoration:none;color:inherit}.card b{display:block;font-size:13.5px;letter-spacing:-.02em}.card span{display:block;margin-top:4px;color:#707986;font-size:11.5px;line-height:1.35}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;border-radius:999px;padding:10px 14px;font-size:12.5px;font-weight:800;transition:.18s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.viewer{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#fff}.viewer.show{display:flex}.viewerTop{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.98);backdrop-filter:blur(12px)}.viewerClose{height:36px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#242933;padding:0 12px;font-size:13px;font-weight:900}.viewerTitle{min-width:0;flex:1;font-size:16px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewerLink{height:34px;border:1px solid #dbe7f8;border-radius:999px;background:#f5f9ff;color:var(--blue);padding:0 11px;display:inline-flex;align-items:center;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap}.viewerFrame{flex:1;width:100%;min-height:0;border:0;background:#fff;display:block}@media(max-width:560px){.top{padding-left:10px;padding-right:10px}.panel{padding-left:10px;padding-right:10px}.grid{grid-template-columns:1fr;padding-left:10px;padding-right:10px}.preview{min-height:calc(100dvh - 232px)}.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.viewerTop{height:52px;flex-basis:52px}.viewerClose{height:34px;padding:0 11px}.viewerTitle{font-size:15px}.viewerLink{height:32px;padding:0 10px}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">보</div><div class="titleWrap"><h1>댓글 UX 시안 허브</h1><p class="sub">추천·비추천까지 실제 동작</p></div></div><nav id="tabs" class="controls"></nav></header><section class="panel"><div class="panelTop"><div><div id="name" class="name"></div><p id="desc" class="desc"></p></div><span class="pill">실제 화면</span></div><div id="meta" class="meta"></div><div class="actions"><button id="openPreview" class="btn primary" type="button">실제 화면 띄우기</button><button id="reload" class="btn" type="button">새로고침</button><button id="copy" class="btn" type="button">실제 주소 복사</button><a id="raw" class="btn warn" target="_blank" rel="noopener">GitHub</a></div></section><section class="screen"><iframe id="preview" class="preview" title="댓글 시안 실제 화면 미리보기"></iframe></section><section class="grid" id="quick"></section></main><section id="viewer" class="viewer" aria-hidden="true"><div class="viewerTop"><button id="closeViewer" class="viewerClose" type="button">창닫기</button><div id="viewerTitle" class="viewerTitle">댓글 시안</div><a id="viewerExternal" class="viewerLink" target="_blank" rel="noopener">새창</a></div><iframe id="viewerFrame" class="viewerFrame" title="댓글 시안 실제 화면"></iframe></section><div id="toast" class="toast">복사됨</div><script>
const version=Date.now();
const demos=[
{id:'depth2',tab:'2뎁스',name:'스레드 2뎁스',file:'depth-viewer.html?mode=t2',github:'depth-viewer.html',desc:'답글 접기/펼치기와 추천/비추천이 동작합니다.',metrics:[['2단계','댓글 깊이'],['24px','전 뎁스 프사'],['동작','추천/비추천']]},
{id:'depth3',tab:'3뎁스',name:'스레드 3뎁스',file:'depth-viewer.html?mode=t3',github:'depth-viewer.html',desc:'대댓글의 하위 답글까지 노드별로 접고 펼치며 추천/비추천이 동작합니다.',metrics:[['3단계','댓글 깊이'],['노드별','−/+ 토글'],['동작','추천/비추천']]},

];
const $=s=>document.querySelector(s);let currentDemo=null;function withVersion(path,id){const sep=path.includes('?')?'&':'?';return `./${path}${sep}v=${id}-${version}`}function url(d){return withVersion(d.file,d.id)}function liveUrl(d){const target=new URL(url(d),location.href).href;return `./live-viewer.html?src=${encodeURIComponent(target)}&title=${encodeURIComponent(d.name)}&v=${version}`}function githubUrl(d){return `https://github.com/bobaekimboae/comment-depth-comparison/blob/main/${d.github}`}function renderTabs(active){$('#tabs').innerHTML=demos.map(d=>`<button class="tab ${d.id===active.id?'on':''}" data-id="${d.id}">${d.tab}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setDemo(b.dataset.id))}function setDemo(id){const d=demos.find(x=>x.id===id)||demos[0];currentDemo=d;renderTabs(d);$('#name').textContent=d.name;$('#desc').textContent=d.desc;$('#meta').innerHTML=d.metrics.map(m=>`<div class="metric"><b>${m[0]}</b><span>${m[1]}</span></div>`).join('');$('#raw').href=githubUrl(d);$('#preview').src=url(d);history.replaceState(null,'',`#${d.id}`)}function openFull(){const d=currentDemo||demos[0];const live=liveUrl(d);const opened=window.open(live,'_blank','noopener,noreferrer');if(!opened){openFallback(d)}}function openFallback(d){const link=url(d);$('#viewerTitle').textContent=d.name;$('#viewerExternal').href=liveUrl(d);$('#viewerFrame').src=link;$('#viewer').classList.add('show');$('#viewer').setAttribute('aria-hidden','false');document.body.classList.add('lock')}function closeFull(){const viewer=$('#viewer');viewer.classList.remove('show');viewer.setAttribute('aria-hidden','true');$('#viewerFrame').src='about:blank';document.body.classList.remove('lock')}$('#openPreview').onclick=openFull;$('#closeViewer').onclick=closeFull;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#viewer').classList.contains('show'))closeFull()});$('#reload').onclick=()=>{const d=currentDemo||demos[0];$('#preview').src=withVersion(d.file,'reload-'+Date.now())};$('#copy').onclick=async()=>{const d=currentDemo||demos[0];const link=new URL(liveUrl(d),location.href).href;try{await navigator.clipboard.writeText(link);showToast('실제 화면 주소 복사됨')}catch(e){showToast(link)}};function showToast(t){const toast=$('#toast');toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}$('#quick').innerHTML=demos.map(d=>`<a class="card" href="${liveUrl(d)}" target="_blank" rel="noopener"><b>${d.name}</b><span>${d.desc}</span></a>`).join('');setDemo(location.hash.replace('#','')||'depth2');
