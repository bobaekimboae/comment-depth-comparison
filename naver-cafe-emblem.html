ackground:#fff;border-radius:22px 22px 0 0;overflow:auto;box-shadow:0 -12px 34px rgba(0,0,0,.18)}.sheetHead{position:sticky;top:0;background:#fff;z-index:2;height:56px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 18px;gap:12px}.grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:4px;background:#d0d1d5}.sheetTitle{font-size:17px;font-weight:820;letter-spacing:-.04em;margin-top:10px;flex:1}.close{font-size:30px;line-height:1;color:#333;margin-top:8px}.detail{padding:18px}.profile{display:flex;gap:10px;align-items:flex-start}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#edf0f4}.profileMain{flex:1;min-width:0}.nickLine{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:820;letter-spacing:-.035em}.follow{margin-left:auto;height:30px;border-radius:16px;background:#fff2f3;color:#e83a3d;padding:0 13px;font-size:13px;font-weight:820}.ownerLine{margin-top:4px;display:flex;align-items:center;gap:5px;color:#91949a;font-size:13.5px;font-weight:520;letter-spacing:-.025em}.ownerLine .emblem{width:19px;height:13px;max-height:13px;flex-basis:19px;opacity:.9;transform:translateY(1px)}.detailTitle{font-size:18px;line-height:1.35;font-weight:820;letter-spacing:-.05em;margin:16px 0 8px}.spec{display:flex;flex-wrap:wrap;gap:8px;color:#5d6067;font-size:13.2px;margin-bottom:10px}.rate{color:#e93f3f;font-weight:820}.detailText{font-size:15.8px;line-height:1.7;letter-spacing:-.035em;color:#191a1f}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}.gallery img{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover}.actions{display:flex;align-items:center;gap:18px;color:#5b6470;font-size:14px;margin-top:16px}.actions button{display:flex;align-items:center;gap:5px;font-weight:720}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;transition:.16s;pointer-events:none;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:370px){.phone{max-width:360px}.title{font-size:18px}.appbar{height:62px;gap:15px;padding-left:20px;padding-right:16px}.itemTitle{font-size:15.3px}.meta{font-size:12.8px}.emblem{width:17px;height:11px;max-height:11px;flex-basis:17px}.ownerLine .emblem{width:18px;height:12px;max-height:12px;flex-basis:18px}.item{grid-template-columns:minmax(0,1fr) auto 47px;padding-right:14px}.item.noThumb{grid-template-columns:minmax(0,1fr) 47px}.thumb,.thumbWrap{width:57px;height:57px}.commentBox{width:47px;height:59px}.list{padding-left:16px}.fab{right:16px;width:60px;height:60px}}

const icons={tesla:'https://cdn.simpleicons.org/tesla/171A20',ferrari:'https://cdn.simpleicons.org/ferrari/D40000',lamborghini:'https://cdn.simpleicons.org/lamborghini/CBA135',porsche:'https://cdn.simpleicons.org/porsche/B12B28',mclaren:'https://cdn.simpleicons.org/mclaren/FF0000',bugatti:'https://cdn.simpleicons.org/bugatti/BE0030',aston:'https://cdn.simpleicons.org/astonmartin/00665E',maserati:'https://cdn.simpleicons.org/maserati/0C2340',bentley:'https://cdn.simpleicons.org/bentley/333333',rolls:'https://cdn.simpleicons.org/rollsroyce/281432',bmw:'https://cdn.simpleicons.org/bmw/0066B1',benz:'https://cdn.simpleicons.org/mercedes/242424'};

const posts=[
{brand:'ferrari',name:'페라리',model:'296 GTB',verified:true,user:'분당레드존',time:'3시간 전',view:'조회 342',reply:18,title:'296 GTB 시승 후 브레이크 감각이 생각보다 날카롭네요',text:'하이브리드 슈퍼카라고 해서 부드럽게만 생각했는데, 초반 응답이 굉장히 빠릅니다. 일상 주행에서는 타이어 온도 관리가 더 중요해 보입니다.',photos:3,img:img[0],fresh:true},
{brand:'lamborghini',name:'람보르기니',model:'우라칸 EVO',verified:true,user:'강남V10오너',time:'4시간 전',view:'조회 511',reply:27,title:'우라칸 EVO 저속 승차감, 생각보다 버틸만한가요?',text:'도심 위주로 타면 과속방지턱과 주차장 진입각이 관건입니다. 배기음 만족도는 높지만 데일리성은 포르쉐 쪽이 확실히 편합니다.',photos:5,img:img[1],fresh:true},
{brand:'porsche',name:'포르쉐',model:'911 Carrera S',verified:true,user:'서초플랫식스',time:'5시간 전',view:'조회 288',reply:9,title:'911은 결국 기본기가 답이네요. 옵션보다 차체 밸런스',text:'고속 안정감과 조향 감각이 너무 자연스럽습니다. 옵션 욕심보다 타이어와 브레이크 컨디션을 먼저 보는 게 맞다고 봅니다.',photos:2,img:img[2]},
{brand:'mclaren',name:'맥라렌',model:'Artura',verified:false,user:'카본궁금',time:'6시간 전',view:'조회 174',reply:6,title:'아투라 중고 보증 조건 확인할 때 뭘 봐야 하나요?',text:'인증 차주가 아니라 실제 소유자 정보는 표시하지 않습니다. 배터리 보증과 서비스센터 접근성, 사고 수리 이력을 같이 봐야 합니다.'},
{brand:'bugatti',name:'부가티',model:'Chiron',verified:false,user:'하이퍼카구경러',time:'8시간 전',view:'조회 692',reply:41,title:'시론 실물 본 사람 있나요? 차폭 체감이 궁금합니다',text:'국내 도로와 주차 환경에서는 차폭보다 보험·정비·보관 환경이 먼저입니다. 리스트에서는 엠블럼만 노출됩니다.',photos:4,img:img[3]},
{brand:'aston',name:'애스턴마틴',model:'DB12',verified:true,user:'영국GT취향',time:'10시간 전',view:'조회 203',reply:11,title:'DB12 실내 마감은 벤틀리급으로 봐도 될까요?',text:'가죽과 금속 버튼 감성은 좋지만 인포테인먼트 안정성은 직접 확인 필요합니다. GT 성향이라 장거리 피로도는 낮았습니다.',photos:3,img:img[4]},
{brand:'maserati',name:'마세라티',model:'MC20',verified:true,user:'모데나사운드',time:'12시간 전',view:'조회 337',reply:22,title:'MC20은 감가 감수해도 살 만한 차인가요?',text:'주행 감각은 확실히 특별합니다. 다만 감가와 부품 대기 기간을 감수할 수 있는지 먼저 계산해야 합니다.'},
{brand:'bentley',name:'벤틀리',model:'Continental GT',verified:true,user:'그랜드투어러',time:'15시간 전',view:'조회 261',reply:14,title:'컨티넨탈 GT 장거리 만족도 공유합니다',text:'고속도로 장거리에서는 피로도가 매우 낮습니다. 단, 22인치 휠이면 노면 충격이 예상보다 올라옵니다.',photos:2,img:img[0]},
{brand:'rolls',name:'롤스로이스',model:'Ghost',verified:false,user:'쇼퍼드림',time:'18시간 전',view:'조회 407',reply:30,title:'고스트는 오너드리븐으로도 괜찮나요?',text:'미인증 닉은 오너명/인증 문구를 숨기는 테스트 케이스입니다. 상세에서도 브랜드 설명만 보이게 처리했습니다.'},
{brand:'tesla',name:'테슬라',model:'Model Y',verified:true,user:'전기차궁금',time:'1일 전',view:'조회 621',reply:58,title:'Model Y 후륜 2023년형 전비 후기',text:'가족차로는 승하차와 적재성이 좋습니다. 겨울 전비 하락은 감안해야 하지만 유지비까지 보면 만족도가 높습니다.',photos:6,img:img[2]},
{brand:'bmw',name:'BMW',model:'M4 Competition',verified:true,user:'엠포라이프',time:'1일 전',view:'조회 355',reply:24,title:'M4 컴페티션 데일리로 타는 분들 계신가요?',text:'하체가 단단하지만 적응하면 충분합니다. 타이어 비용과 보험료는 구매 전 반드시 계산해야 합니다.',photos:3,img:img[3]},
{brand:'benz',name:'메르세데스',model:'AMG GT',verified:true,user:'AMG감성',time:'2일 전',view:'조회 299',reply:17,title:'AMG GT 실내 열감과 유지비 질문',text:'여름철 열감과 브레이크 패드 분진이 꽤 있습니다. 감성은 좋지만 관리 난이도는 낮지 않습니다.',photos:2,img:img[4]}
];
function emblem(p,cls='emblem'){return `<img class="${cls}" src="${icons[p.brand]}" alt="${p.name} 엠블럼" loading="lazy">`}
function render(){list.innerHTML=posts.map((p,i)=>`<article class="item ${p.img?'':'noThumb'} ${p.fresh?'isFresh':''}" data-i="${i}"><span class="dot"></span><div class="body"><div class="itemTitle">${p.title}</div><div class="meta">${emblem(p)}<span>${p.user}</span><span>${p.time}</span><span>${p.view}</span></div></div>${p.img?`<div class="thumbWrap"><img class="thumb" src="${p.img}" alt="${p.title} 썸네일">${p.photos?`<span class="photoBadge">${p.photos}+</span>`:''}</div>`:''}<button class="commentBox" type="button"><b>${p.reply}</b><span>댓글</span></button></article>`).join('')}
function openDetail(p){detail.innerHTML=`<div class="profile"><img class="avatar" src="${p.img||img[1]}" alt=""><div class="profileMain"><div class="nickLine"><span>${p.user}</span><button class="follow">팔로우</button></div>${p.verified?`<div class="ownerLine">${emblem(p)}<span>${p.name} ${p.model} 인증 차주</span></div>`:''}</div></div><div class="detailTitle">${p.name} ${p.model} · ${p.title}</div><div class="spec"><span>만족도 <b class="rate">${p.verified?'추천':'확인 필요'}</b></span><span>주행거리 ${p.brand==='tesla'?'450km':'실차 확인'}</span><span>등록 ${p.time}</span></div><div class="detailText">${p.text}</div>${p.img?`<div class="gallery"><img src="${p.img}" alt=""><img src="${img[(posts.indexOf(p)+1)%img.length]}" alt=""><img src="${img[(posts.indexOf(p)+2)%img.length]}" alt=""></div>`:''}<div class="actions"><button class="like">♡ 추천 <span>${Math.max(1,p.reply-3)}</span></button><button>💬 댓글 ${p.reply}</button><button>공유</button></div>`;overlay.classList.add('open')}
render();list.addEventListener('click',e=>{const item=e.target.closest('.item');if(item)openDetail(posts[+item.dataset.i])});close.onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};document.querySelector('.fab').onclick=()=>show('글쓰기 화면 연결 대상');document.querySelectorAll('.cat').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on'));btn.classList.add('on');show(btn.textContent+' 필터')});function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
</script>
</body>
</html>
