<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>댓글 시안 실제 화면</title>
<style>
:root{--ink:#15181d;--muted:#737b86;--line:#e4e7ec;--blue:#1264c4;--red:#ff6154;--bg:#fff;--sheet:#fff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;-webkit-font-smoothing:antialiased}.app{width:100%;height:100dvh;display:flex;flex-direction:column;background:#fff}.bar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:7px;padding:8px 8px calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(255,255,255,.98);backdrop-filter:blur(12px);z-index:10}.close,.tool{height:34px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#20242b;padding:0 10px;font-size:12.5px;font-weight:900;white-space:nowrap}.close{padding:0 11px}.tool.primary{border-color:#cfe0f8;background:#f5f9ff;color:var(--blue)}.title{min-width:0;flex:1;font-size:15.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame{flex:1;width:100%;min-height:0;border:0;background:#fff}.fallback{display:none;padding:22px}.fallback.show{display:block}.fallback h1{font-size:19px;margin:0 0 8px}.fallback p{font-size:14px;line-height:1.5;color:#5f6874}.fallback a{color:var(--blue);font-weight:900}.shade{position:fixed;inset:0;background:rgba(15,18,24,.36);opacity:0;pointer-events:none;transition:.16s;z-index:30}.shade.show{opacity:1;pointer-events:auto}.info{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-radius:20px 20px 0 0;box-shadow:0 -12px 34px rgba(20,24,33,.18);transform:translateY(105%);transition:.18s;padding:10px 16px calc(18px + env(safe-area-inset-bottom))}.info.show{transform:translateY(0)}.handle{width:48px;height:5px;border-radius:999px;background:#c9cdd3;margin:0 auto 14px}.infoTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.info h2{font-size:18px;line-height:1.25;margin:0;letter-spacing:-.035em}.x{width:34px;height:34px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:20px;line-height:1;color:#4b5563}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:10px 0;border-top:1px solid #eef0f3}.row b{font-size:13px;color:#3f4752}.row span{min-width:0;font-size:13px;color:#67707c;line-height:1.45;word-break:break-all}.copy{width:100%;height:40px;margin-top:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:14px;font-weight:900}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:#111827;color:#fff;border-radius:999px;padding:10px 14px;font-size:12.5px;font-weight:900;transition:.16s;z-index:70}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:760px){.bar{height:56px;flex-basis:56px;padding-left:12px;padding-right:12px}.close,.tool{height:36px;padding:0 12px}.title{font-size:16px}.info{left:50%;right:auto;width:min(520px,calc(100% - 24px));transform:translate(-50%,105%);border-radius:20px}.info.show{transform:translate(-50%,0)}}@media(max-width:380px){.close,.tool{font-size:12px;padding:0 8px}.title{font-size:14.5px}}
</style>
</head>
<body>
<main class="app">
  <div class="bar">
    <button id="close" class="close" type="button">창닫기</button>
    <div id="title" class="title">댓글 시안 실제 화면</div>
    <button id="infoBtn" class="tool" type="button">상세정보</button>
    <button id="fullBtn" class="tool primary" type="button">전체화면</button>
  </div>
  <iframe id="frame" class="frame" title="댓글 시안"></iframe>
  <section id="fallback" class="fallback"><h1>열 수 없는 주소입니다</h1><p>허브에서 다시 시안을 선택하세요. <a href="./comment-ui-lab.html">허브로 이동</a></p></section>
</main>
<div id="shade" class="shade"></div>
<section id="info" class="info" aria-hidden="true">
  <div class="handle"></div>
  <div class="infoTop"><h2 id="infoTitle">상세정보</h2><button id="infoClose" class="x" type="button">×</button></div>
  <div class="rows">
    <div class="row"><b>시안</b><span id="infoName"></span></div>
    <div class="row"><b>화면</b><span>폰 목업 없는 실제 브라우저 화면</span></div>
    <div class="row"><b>동작</b><span>추천·비추천, 답글 접기/펼치기, 노드별 댓글 테스트</span></div>
    <div class="row"><b>주소</b><span id="infoUrl"></span></div>
  </div>
  <button id="copy" class="copy" type="button">현재 실제 화면 주소 복사</button>
</section>
<div id="toast" class="toast">복사됨</div>
<script>
const allowed=new Set(['depth-viewer.html','interactive-viewer.html','xianyu-2depth-time-v1.html','youtube-threads-equal-avatar.html','facebook-comments-v1.html','stress.html','reddit-fmkorea-hybrid-v61.html']);
const q=new URLSearchParams(location.search);const src=q.get('src')||'';const title=q.get('title')||'댓글 시안 실제 화면';document.getElementById('title').textContent=title;document.getElementById('infoTitle').textContent=title;document.getElementById('infoName').textContent=title;document.getElementById('infoUrl').textContent=location.href;
function safeSrc(value){try{const decoded=decodeURIComponent(value);const u=new URL(decoded,location.href);if(u.origin!==location.origin)return null;const name=u.pathname.split('/').pop();if(!allowed.has(name))return null;u.searchParams.set('live',Date.now());return u.href}catch(e){return null}}
const target=safeSrc(src);const frame=document.getElementById('frame');const fallback=document.getElementById('fallback');if(target){frame.src=target}else{frame.style.display='none';fallback.classList.add('show')}
function closeWindow(){window.close();setTimeout(()=>{if(document.visibilityState==='visible'){history.length>1?history.back():location.href='./comment-ui-lab.html'}},120)}
async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();document.getElementById('fullBtn').textContent='해제'}else{await document.exitFullscreen();document.getElementById('fullBtn').textContent='전체화면'}}catch(e){toast('브라우저가 전체화면을 막았습니다')}}
function openInfo(){document.getElementById('shade').classList.add('show');document.getElementById('info').classList.add('show');document.getElementById('info').setAttribute('aria-hidden','false')}
function closeInfo(){document.getElementById('shade').classList.remove('show');document.getElementById('info').classList.remove('show');document.getElementById('info').setAttribute('aria-hidden','true')}
async function copyUrl(){try{await navigator.clipboard.writeText(location.href);toast('주소 복사됨')}catch(e){toast(location.href)}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}
document.getElementById('close').onclick=closeWindow;document.getElementById('fullBtn').onclick=toggleFullscreen;document.getElementById('infoBtn').onclick=openInfo;document.getElementById('infoClose').onclick=closeInfo;document.getElementById('shade').onclick=closeInfo;document.getElementById('copy').onclick=copyUrl;document.addEventListener('fullscreenchange',()=>{document.getElementById('fullBtn').textContent=document.fullscreenElement?'해제':'전체화면'});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('info').classList.contains('show'))closeInfo();else closeWindow()}});
</script>
</body>
</html>
