<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>시엔위 2뎁스 시간형 댓글 UI</title>
<style>
:root{--ink:#202124;--name:#aeb3b9;--meta:#a4a8ae;--blue:#244a63;--heart:#5f666e;--line:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.phone{max-width:760px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:20;height:58px;background:#fff;border-bottom:1px solid #f2f2f2;display:flex;align-items:center;gap:12px;padding:0 16px}.back{font-size:30px;line-height:1;color:#1f2328;font-weight:300}.sellerAv{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 30px}.seller{flex:1;font-size:19px;line-height:24px;font-weight:700;letter-spacing:-.02em;color:#16181b}.follow{height:34px;padding:0 15px;border:1px solid #e6e6e6;background:#fff;border-radius:999px;font-size:15px;line-height:32px;font-weight:600;letter-spacing:-.02em;color:#171717}.more{border:0;background:transparent;width:30px;height:30px;display:grid;place-items:center;padding:0}.more svg{width:19px;height:19px;fill:#222}.feed{padding:14px 14px 82px}.item{display:grid;grid-template-columns:30px minmax(0,1fr) 40px;column-gap:14px;row-gap:0;padding:14px 0 15px}.item+.item{border-top:1px solid #fafafa}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#eee;flex:0 0 auto}.content{min-width:0}.name{font-size:15px;line-height:20px;color:var(--name);font-weight:500;letter-spacing:-.01em}.text{margin-top:2px;font-size:16px;line-height:1.45;font-weight:400;color:#202124;letter-spacing:-.018em;word-break:keep-all}.meta{margin-top:7px;font-size:13px;line-height:18px;color:var(--meta);font-weight:400;letter-spacing:-.01em}.heart{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--heart);font-size:12px;line-height:15px;font-weight:400;padding-top:1px}.heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}.reply{grid-column:2 / 4;display:grid;grid-template-columns:24px minmax(0,1fr) 32px;column-gap:10px;row-gap:0;margin:13px 0 0}.reply .avatar{width:24px;height:24px}.reply .name{font-size:14px;line-height:18px;font-weight:500;color:var(--name)}.reply .text{font-size:15px;line-height:1.45;font-weight:400;margin-top:1px}.reply .meta{font-size:13px;line-height:18px;margin-top:6px}.reply .heart{padding-top:0}.reply .heart svg{width:20px;height:20px}.view{grid-column:2 / 4;justify-self:start;margin:10px 0 0;border:0;background:transparent;color:var(--blue);font-size:15px;line-height:20px;font-weight:500;letter-spacing:-.01em;padding:2px 0;display:inline-flex;align-items:center;white-space:nowrap}.view:after{content:'⌄';margin-left:5px;font-weight:400}.item.closed .reply{display:none}.item:not(.closed) .view:after{content:'⌃'}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);max-width:760px;width:100%;height:70px;background:rgba(255,255,255,.96);border-top:1px solid #eee;display:flex;align-items:center;gap:16px;padding:10px 16px}.input{height:42px;border-radius:999px;background:#f4f4f4;color:#9b9b9b;display:flex;align-items:center;padding:0 16px;flex:1;font-size:15px;line-height:42px;font-weight:400;min-width:0}.bicon{display:flex;align-items:center;gap:6px;font-size:18px;line-height:24px;font-weight:600;white-space:nowrap;color:#111}.bicon svg{width:28px;height:28px;fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}@media(max-width:520px){.feed{padding-left:18px;padding-right:14px}.item{grid-template-columns:30px minmax(0,1fr) 36px;column-gap:14px}.text{font-size:15.5px}.heart svg{width:21px;height:21px}.reply{grid-template-columns:24px minmax(0,1fr) 32px}.reply .text{font-size:14.5px}.seller{font-size:18.5px}}
</style>
</head>
<body><main class="phone"><header class="top"><div class="back">‹</div><img class="sellerAv" src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=120&q=80"><div class="seller">보배 중고차 토론</div><button class="follow">+ 팔로우</button><button class="more"><svg viewBox="0 0 20 20"><path d="M16 11.75a1.75 1.75 0 11.001-3.501A1.75 1.75 0 0116 11.75ZM11.75 10a1.75 1.75 0 10-3.501.001A1.75 1.75 0 0011.75 10Zm-6 0a1.75 1.75 0 10-3.501.001A1.75 1.75 0 005.75 10Z"/></svg></button></header><section id="feed" class="feed"></section><footer class="bottom"><div class="input">차종, 연비, 정비비 의견 남기기...</div><div class="bicon"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.55-9.7-9.2C.7 8.45 2.65 5 6.25 5c2.05 0 3.4 1.15 4.2 2.28C11.25 6.15 12.6 5 14.65 5c3.6 0 5.55 3.45 3.95 6.8C16.4 16.45 12 21 12 21Z"/></svg><span>1219</span></div></footer></main><script>
const imgs=['https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=120&q=80'];
const rows=[['쏘렌토하브','저도 왕복 42km면 하이브리드 쪽이 맞다고 봅니다 😂','06-27 서울 답글','23','정비소삼촌','답글 쏘렌토하브 : 도심 정체가 많으면 체감 연비 차이 큽니다','13시간 전 경기 답글','8'],['싼타페고민','2열이랑 트렁크는 싼타페가 편했는데 중고가 방어는 쏘렌토가 안정적이네요','07-13 경기 답글','9','하브실차주','답글 싼타페고민 : 가족이 뒤에 오래 타면 2열 승차감 먼저 보세요','4일 전 서울 답글','8'],['연비체크러','겨울 공조 켜면 숫자가 확 내려가서 시승 후기만 보면 안 됩니다','4일 전 인천 답글','1','타이어마스터','답글 연비체크러 : 18인치가 승차감이랑 타이어값 모두 무난합니다','8일 전 대전 답글','6'],['중고가보는눈','중고가까지 보면 인기 트림이 제일 중요합니다','06-27 부산 답글','20','보험이력체커','답글 중고가보는눈 : 보험이력은 금액보다 수리 위치가 중요합니다','06-28 충남 답글','4'],['카시트아빠','카시트 두 개면 2열 문 열림각이 진짜 중요합니다','8일 전 대구 답글','18','트렁크테트리스','답글 카시트아빠 : 유모차 넣고 빼는 동선도 꼭 확인하세요','13시간 전 경기 답글','7'],['캠핑짐만렙','캠핑박스 넣어보면 트렁크 리터보다 입구 높이가 먼저 보입니다','13시간 전 강원 답글','12','차박준비중','답글 캠핑짐만렙 : 평탄화 단차가 있으면 차박은 바로 불편합니다','3일 전 제주 답글','5'],['전기차궁금','하이브리드만 보지 말고 충전 여건 있으면 전기 SUV도 비교해볼 만합니다','1시간 전 경기 답글','31','배터리보증봄','답글 전기차궁금 : 배터리 보증 남은 기간과 SOH 확인이 먼저입니다','1시간 전 서울 답글','9'],['패밀리차주','아이들이 타면 2열 승차감과 멀미 여부가 연비보다 더 크게 느껴집니다','2시간 전 인천 답글','15','후석승차감','답글 패밀리차주 : 시승할 때 뒷좌석에 직접 앉아봐야 합니다','2시간 전 경기 답글','3']];
const heart='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.55-9.7-9.2C.7 8.45 2.65 5 6.25 5c2.05 0 3.4 1.15 4.2 2.28C11.25 6.15 12.6 5 14.65 5c3.6 0 5.55 3.45 3.95 6.8C16.4 16.45 12 21 12 21Z"/></svg>';
function row(r,i){return `<article class="item ${i%3===0?'closed':''}"><img class="avatar" src="${imgs[i%imgs.length]}"><div class="content"><div class="name">${r[0]}</div><div class="text">${r[1]}</div><div class="meta">${r[2]}</div></div><div class="heart">${heart}<span>${r[3]}</span></div><div class="reply"><img class="avatar" src="${imgs[(i+4)%imgs.length]}"><div><div class="name">${r[4]}</div><div class="text">${r[5]}</div><div class="meta">${r[6]}</div></div><div class="heart">${heart}<span>${i+1}</span></div></div><button class="view" data-count="${r[7]}">답글 ${r[7]}개 보기</button></article>`}
feed.innerHTML=rows.map(row).join('');document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{const item=b.closest('.item');const closed=item.classList.toggle('closed');b.textContent=closed?'답글 '+b.dataset.count+'개 보기':'답글 닫기'});
</script></body></html>
