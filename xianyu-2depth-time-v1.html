<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>시엔위 2뎁스 시간형 댓글 UI · reply detail</title>
<style>
:root{--ink:#202124;--name:#adb2b8;--metaDate:#a6abb1;--metaReply:#71777e;--blue:#244a63;--heart:#5f666e}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.phone{max-width:760px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:20;height:58px;background:#fff;border-bottom:1px solid #f2f2f2;display:flex;align-items:center;gap:12px;padding:0 16px}.back{font-size:30px;line-height:1;color:#1f2328;font-weight:300;cursor:pointer}.sellerAv{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 30px}.seller{flex:1;font-size:19px;line-height:24px;font-weight:700;letter-spacing:-.02em;color:#16181b}.follow{height:34px;padding:0 15px;border:1px solid #e6e6e6;background:#fff;border-radius:999px;font-size:15px;line-height:32px;font-weight:600;letter-spacing:-.02em;color:#171717}.more{border:0;background:transparent;width:30px;height:30px;display:grid;place-items:center;padding:0}.more svg{width:19px;height:19px;fill:#222}.feed{padding:14px 14px 82px}.item{display:grid;grid-template-columns:30px minmax(0,1fr) 40px;column-gap:14px;row-gap:0;padding:14px 0 15px}.item+.item{border-top:1px solid #fafafa}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#eee;flex:0 0 auto}.content{min-width:0}.name{font-size:15px;line-height:20px;color:var(--name);font-weight:400;letter-spacing:-.01em}.text{margin-top:2px;font-size:16px;line-height:1.45;font-weight:400;color:#202124;letter-spacing:-.018em;word-break:keep-all}.meta{margin-top:7px;font-size:13px;line-height:18px;font-weight:400;letter-spacing:-.01em;color:var(--metaDate);display:block}.metaDate{color:var(--metaDate);font-size:13px;line-height:18px;font-weight:400}.metaReply{color:var(--metaReply);font-size:13px;line-height:18px;font-weight:500;margin-left:4px}.heart{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--heart);font-size:12px;line-height:15px;font-weight:400;padding-top:1px}.heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}.reply{grid-column:2 / 4;display:grid;grid-template-columns:24px minmax(0,1fr) 32px;column-gap:10px;row-gap:0;margin:13px 0 0}.reply .avatar{width:24px;height:24px}.reply .name{font-size:14px;line-height:18px;font-weight:400;color:var(--name)}.reply .text{font-size:15px;line-height:1.45;font-weight:400;margin-top:1px}.reply .meta{font-size:13px;line-height:18px;margin-top:6px}.reply .heart{padding-top:0}.reply .heart svg{width:20px;height:20px}.view{grid-column:2 / 4;justify-self:start;margin:10px 0 0;border:0;background:transparent;color:var(--blue);font-size:15px;line-height:20px;font-weight:500;letter-spacing:-.01em;padding:2px 0;display:inline-flex;align-items:center;white-space:nowrap}.view:after{content:'⌄';margin-left:5px;font-weight:400}.item.closed .reply{display:none}.detailIntro{display:grid;grid-template-columns:30px minmax(0,1fr) 40px;column-gap:14px;padding:0 0 12px}.detailFeed{padding-left:78px;padding-right:14px}.detailItem{display:grid;grid-template-columns:24px minmax(0,1fr) 34px;column-gap:10px;row-gap:0;padding:12px 0}.detailItem .avatar{width:24px;height:24px}.detailItem .name{font-size:15px;line-height:20px;font-weight:400;color:var(--name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detailItem .text{font-size:16px;line-height:1.45;margin-top:2px}.detailItem .meta{margin-top:7px}.authorTag{display:inline-flex;margin-left:5px;vertical-align:1px;background:#222;color:#fff;border-radius:3px;padding:1px 5px;font-size:11px;line-height:16px;font-weight:500}.moreReplies{margin:14px 0 8px 78px;border:0;background:transparent;color:var(--blue);font-size:15px;line-height:20px;font-weight:500;padding:2px 0;display:inline-flex;align-items:center}.moreReplies:after{content:'⌄';margin-left:5px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);max-width:760px;width:100%;height:70px;background:rgba(255,255,255,.96);border-top:1px solid #eee;display:flex;align-items:center;gap:16px;padding:10px 16px}.input{height:42px;border-radius:999px;background:#f4f4f4;color:#9b9b9b;display:flex;align-items:center;padding:0 16px;flex:1;font-size:15px;line-height:42px;font-weight:400;min-width:0}.bicon{display:flex;align-items:center;gap:6px;font-size:18px;line-height:24px;font-weight:600;white-space:nowrap;color:#111}.bicon svg{width:28px;height:28px;fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}@media(max-width:520px){.feed{padding-left:18px;padding-right:14px}.item{grid-template-columns:30px minmax(0,1fr) 36px;column-gap:14px}.text{font-size:15.5px}.heart svg{width:21px;height:21px}.reply{grid-template-columns:24px minmax(0,1fr) 32px}.reply .text{font-size:14.5px}.seller{font-size:18.5px}.detailFeed{padding-left:78px}.detailItem .text{font-size:15.5px}.moreReplies{margin-left:78px}}
</style>
</head>
<body><main class="phone"><header class="top"><div id="back" class="back">‹</div><img class="sellerAv" src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=120&q=80"><div id="title" class="seller">보배 중고차 토론</div><button class="follow">+ 팔로우</button><button class="more"><svg viewBox="0 0 20 20"><path d="M16 11.75a1.75 1.75 0 11.001-3.501A1.75 1.75 0 0116 11.75ZM11.75 10a1.75 1.75 0 10-3.501.001A1.75 1.75 0 0011.75 10Zm-6 0a1.75 1.75 0 10-3.501.001A1.75 1.75 0 005.75 10Z"/></svg></button></header><section id="feed" class="feed"></section><footer class="bottom"><div class="input">차종, 연비, 정비비 의견 남기기...</div><div class="bicon"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.55-9.7-9.2C.7 8.45 2.65 5 6.25 5c2.05 0 3.4 1.15 4.2 2.28C11.25 6.15 12.6 5 14.65 5c3.6 0 5.55 3.45 3.95 6.8C16.4 16.45 12 21 12 21Z"/></svg><span>1219</span></div></footer></main><script>
const imgs=['https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1592853625511-ad0edcc69c07?auto=format&fit=crop&w=120&q=80'];
const names=['쏘렌토하브','싼타페고민','연비체크러','중고가보는눈','카시트아빠','캠핑짐만렙','전기차궁금','패밀리차주','도심정체러','고속도로요정','트렁크테트리스','정비소삼촌','타이어마스터','하브실차주','배터리보증봄','보험이력체커','차박준비중','2열승차감','디젤끝물','주차초보','출퇴근42km','엔진오일러','중고SUV찾는중','카니발비교','하이브리드초보'];
const texts=['왕복 42km면 하이브리드 쪽이 맞다고 봅니다. 시내 정체가 많으면 차이가 큽니다 😂','2열이랑 트렁크는 싼타페가 편했는데 중고가 방어는 쏘렌토가 안정적이네요','겨울 공조 켜면 숫자가 확 내려가서 시승 후기만 보면 안 됩니다','중고가까지 보면 인기 트림이 제일 중요합니다. 색상도 은근히 봐야 합니다','카시트 두 개면 2열 문 열림각이 진짜 중요합니다','캠핑박스 넣어보면 트렁크 리터보다 입구 높이가 먼저 보입니다','하이브리드만 보지 말고 충전 여건 있으면 전기 SUV도 비교해볼 만합니다','아이들이 타면 2열 승차감과 멀미 여부가 연비보다 크게 느껴집니다','도심 위주면 큰 차도 연비보다 회전반경이 더 스트레스였습니다','고속도로 보조 기능은 장거리에서 피로 차이가 확실합니다','트렁크 깊이보다 유모차 넣고 빼는 동선이 더 중요했습니다','정비소 접근성은 생각보다 큽니다. 근처 블루핸즈나 오토큐도 확인하세요','18인치 휠이 승차감과 타이어값 모두 무난했습니다','하브는 막히는 구간에서 조용한 게 제일 만족도가 높았습니다','배터리 보증은 연식별 조건 꼭 확인해야 합니다','보험이력은 금액보다 수리 위치가 더 중요합니다','평탄화 단차가 있으면 차박은 바로 불편합니다','뒷좌석에 직접 앉아보면 전시장 설명보다 빨리 판단됩니다','디젤은 장거리면 아직 괜찮지만 도심이면 부담이 커졌습니다','주차장 폭 좁은 아파트면 차폭부터 보세요'];
const replyNames=['정비소삼촌','하브실차주','타이어마스터','보험이력체커','트렁크테트리스','차박준비중','배터리보증봄','후석승차감','중고가체커','도심정체러','실차주후기','오토큐단골','패밀리SUV','타본사람','정숙성봄'];
const replies=['답글 {name} : 도심 정체가 많으면 체감 연비 차이 큽니다','답글 {name} : 가족이 뒤에 오래 타면 2열 승차감 먼저 보세요','답글 {name} : 18인치가 승차감이랑 타이어값 모두 무난합니다','답글 {name} : 보험이력은 금액보다 수리 위치가 중요합니다','답글 {name} : 유모차 넣고 빼는 동선도 꼭 확인하세요','답글 {name} : 평탄화 단차가 있으면 차박은 바로 불편합니다','답글 {name} : 배터리 보증 남은 기간과 SOH 확인이 먼저입니다','답글 {name} : 시승할 때 뒷좌석에 직접 앉아봐야 합니다','답글 {name} : 인기 트림이면 나중에 팔 때도 훨씬 편합니다','답글 {name} : 막히는 구간이 많으면 전기모터 개입이 체감됩니다','답글 {name} : 맞아요 실제로 타보면 옵션보다 시야가 더 중요합니다','답글 {name} : 정비비는 차종보다 주행 패턴이 더 크게 갈립니다','답글 {name} : 장거리 자주 타면 반자율 옵션은 넣는 게 낫습니다','답글 {name} : 숫자보다 가족 반응이 더 정확하더라고요','답글 {name} : 결국 유지비까지 보면 계산이 달라집니다'];
const places=['서울','경기','인천','부산','대구','대전','광주','울산','강원','충남','충북','전북','전남','경북','경남','제주'];
const times=['방금 전','3분 전','8분 전','17분 전','34분 전','1시간 전','2시간 전','3시간 전','13시간 전','20시간 전','1일 전','2일 전','4일 전','06-27','07-13','08-14'];
const emojis=['🍀🍀🍀','🔥🔥','😂','👍👍','😺😺','🌸🍀🌸','맞습니다','좋은 정보네요','저도 동의합니다','생각보다 중요합니다'];
const heart='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.55-9.7-9.2C.7 8.45 2.65 5 6.25 5c2.05 0 3.4 1.15 4.2 2.28C11.25 6.15 12.6 5 14.65 5c3.6 0 5.55 3.45 3.95 6.8C16.4 16.45 12 21 12 21Z"/></svg>';
const pick=(a,i)=>a[i%a.length];
function metaLine(s){const m=s.match(/^(.*) 답글$/);return m?`<span class="metaDate">${m[1]}</span><span class="metaReply">답글</span>`:`<span class="metaDate">${s}</span>`}
function makeRow(i){const name=pick(names,i);const replyName=pick(replyNames,i+3);const meta=`${pick(times,i)} ${pick(places,i+5)} 답글`;const replyMeta=`${pick(times,i+8)} ${pick(places,i+9)} 답글`;const count=1+(i*7)%66;const likes=(i*13)%128;const rlikes=(i*5)%24;const text=pick(texts,i);const replyText=pick(replies,i).replace('{name}',name);return {name,text,meta,likes,replyName,replyText,replyMeta,count,rlikes,i}}
const rows=Array.from({length:100},(_,i)=>makeRow(i));
function row(r,i){const closed=i%3!==1;return `<article class="item ${closed?'closed':''}"><img class="avatar" src="${imgs[i%imgs.length]}"><div class="content"><div class="name">${r.name}</div><div class="text">${r.text}</div><div class="meta">${metaLine(r.meta)}</div></div><div class="heart">${heart}<span>${r.likes}</span></div><div class="reply"><img class="avatar" src="${imgs[(i+4)%imgs.length]}"><div><div class="name">${r.replyName}</div><div class="text">${r.replyText}</div><div class="meta">${metaLine(r.replyMeta)}</div></div><div class="heart">${heart}<span>${r.rlikes}</span></div></div><button class="view" data-index="${i}" data-count="${r.count}">답글 ${r.count}개 보기</button></article>`}
function detailRow(parent,j){const n=pick(replyNames,j+parent.i);const isAuthor=j%3===1;const target=isAuthor?pick(replyNames,j+2):parent.name;const body=`답글 ${target} : ${pick(emojis,j)} ${pick(texts,j+parent.i).replace('습니다.','습니다')}`;const meta=`${pick(times,j+9)} ${pick(places,j+3)} 답글`;return `<article class="detailItem"><img class="avatar" src="${imgs[(j+parent.i+2)%imgs.length]}"><div><div class="name">${n}${isAuthor?'<span class="authorTag">작성자</span>':''}</div><div class="text">${body}</div><div class="meta">${metaLine(meta)}</div></div><div class="heart">${heart}<span>${(j*7+parent.i)%4?((j*3)%7):''}</span></div></article>`}
function renderList(){title.textContent='보배 중고차 토론';feed.className='feed';feed.innerHTML=rows.map(row).join('');document.querySelectorAll('.view').forEach(b=>b.onclick=()=>renderDetail(rows[+b.dataset.index]));window.scrollTo(0,0)}
function renderDetail(parent){title.textContent=parent.name;const detailCount=Math.max(12,parent.count);let html=`<div class="detailIntro"><img class="avatar" src="${imgs[parent.i%imgs.length]}"><div><div class="name">${parent.name}</div><div class="meta">${metaLine(parent.meta)}</div></div><div class="heart">${heart}<span>${parent.likes}</span></div></div><section class="detailFeed">`;for(let j=0;j<detailCount;j++)html+=detailRow(parent,j);html+=`</section><button class="moreReplies">답글 ${Math.max(0,65-detailCount)}개 더 보기</button>`;feed.className='feed detailMode';feed.innerHTML=html;window.scrollTo(0,0)}
back.onclick=()=>{if(feed.classList.contains('detailMode'))renderList();else history.back()};renderList();
</script></body></html>
