<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보배드림 댓글 · 200개 시나리오</title>
<style>
  :root{--ink:#15171a;--sub:#72777f;--line:#e7eaee;--thread:#cfd6dd;--blue:#1264c4;--red:#d64d4d;--soft:#f6f8fa;--panel:#fff}
  *{box-sizing:border-box}html{background:#eef1f4}body{margin:0;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif;background:#eef1f4;letter-spacing:0}.page{width:min(760px,100%);margin:0 auto;background:var(--panel);min-height:100vh}.head{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px 18px 12px}h1{margin:0 0 14px;font-size:21px;line-height:1.28;font-weight:900}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{font-size:18px;font-weight:900}.count b{color:var(--blue)}.sort{border:0;background:transparent;color:var(--blue);font:800 15px inherit;padding:6px 0;cursor:pointer}.tools{display:flex;gap:8px;overflow:auto;padding-top:13px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #d8dde4;background:#fff;color:#4d5661;border-radius:999px;padding:8px 11px;font:800 13px inherit;cursor:pointer}.chip.active{border-color:#1264c4;color:#1264c4;background:#f0f6ff}.comments{padding:4px 18px 34px}.comment{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:11px;padding:17px 0;border-bottom:1px solid var(--line)}.comment:last-child{border-bottom:0}.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#c7d0d8;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}.avatar img{display:block;width:100%;height:100%;object-fit:cover}.avatar-fallback{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,#9fb4c4,#4f6474);color:#fff;font-weight:900}.meta{display:flex;align-items:center;gap:6px;min-width:0}.name{font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:12px;color:var(--sub);white-space:nowrap}.badge{display:inline-flex;align-items:center;height:21px;border:1px solid #dfe4ea;border-radius:6px;background:#fafbfc;color:#666e78;font-size:11px;font-weight:900;padding:0 6px;white-space:nowrap}.badge.root{border-color:#ffd9bb;background:#fff3e8;color:#bc5b14}.text{margin:7px 0 0;font-size:15.5px;line-height:1.54;word-break:keep-all}.actions{display:flex;align-items:center;gap:12px;margin-top:10px;color:var(--sub);font-size:13px}.actions button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}.vote{display:inline-flex;align-items:center;gap:4px;min-width:34px}.vote .thumb{font-size:17px;line-height:1;filter:grayscale(1);opacity:.72}.vote b{font-size:12px;min-width:8px;text-align:left}.vote.active.up{color:var(--blue);font-weight:900}.vote.active.down{color:var(--red);font-weight:900}.vote.active .thumb{filter:none;opacity:1}.reply-action,.collapse-one{font-weight:800;color:#7b8088}.reply-group{position:relative;margin-left:22px;padding-left:20px}.reply-group:before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--thread)}.reply{border-bottom:0;padding:14px 0}.reply:before{content:"";position:absolute;left:-20px;top:36px;width:15px;height:1px;background:var(--thread)}.level-2{margin-left:18px;padding-left:18px}.level-3{margin-left:18px;padding-left:18px}.level-over{margin-left:0;padding-left:0}.level-over:before{display:none}.level-over>.reply:before{display:none}.is-hidden{display:none}.notice{margin:18px 0 0;padding:13px 0 0;border-top:1px solid var(--line);color:var(--sub);font-size:13px;line-height:1.55}.depth-cap{color:#8a6b00;background:#fff9da;border-color:#f2e7aa}
  @media(max-width:480px){.head{padding:18px 16px 11px}.comments{padding-left:16px;padding-right:16px}h1{font-size:20px}.comment{grid-template-columns:42px minmax(0,1fr);gap:10px}.avatar{width:40px;height:40px}.text{font-size:15px}.actions{gap:11px}.reply-group{margin-left:17px;padding-left:16px}.reply:before{left:-16px;width:12px}.level-2,.level-3{margin-left:14px;padding-left:14px}.meta{flex-wrap:wrap;row-gap:4px}.badge{height:20px}}
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <h1>보배드림 댓글 · 레딧 × 에펨코리아</h1>
    <div class="top"><span class="count">댓글 <b id="totalCount">200</b></span><button id="sortBtn" class="sort" type="button">최신순⌄</button></div>
    <div class="tools" role="toolbar" aria-label="댓글 보기 옵션">
      <button class="chip active" type="button" data-filter="all">전체 200</button>
      <button class="chip" type="button" data-filter="root">원댓글</button>
      <button class="chip" type="button" data-filter="deep">대댓글+</button>
      <button class="chip" type="button" id="collapseAll">전체 접기</button>
    </div>
  </header>
  <section id="comments" class="comments" aria-live="polite"></section>
</main>
<script>
const names=['엔진소리좋아','연비왕김대표','카페인오일','주행거리장인','디젤아재','하이브리드러버','정비왕','타이어맛집','중고차보는눈','블박필수','차알못탈출','고속주행러','도심출퇴근','패밀리카찾음','실오너후기','보험료무섭다','옵션은풀옵','감가계산기','세차는손세차','차박초보','SUV고민중','모터리뷰러','노면소음싫어','핸들감성','브레이크체크','전기차궁금','국산차응원','수입차눈팅','출고대기중','리스견적봄','현금완납러','중립기어','차선유지굿','연료비계산','아빠차고민','엄마차추천','고속도로요정','엔진오일매니아','겨울연비주의','튜닝은순정'];
const roots=['쏘렌토 HEV 실제 연비 어떠셨나요?','패밀리 SUV로 싼타페랑 쏘렌토 중 뭐가 나을까요?','출퇴근 왕복 42km면 하이브리드가 확실히 이득일까요?','3열 자주 안 쓰면 중형 SUV가 맞는 선택인지 궁금합니다.','요즘 신차 가격 보면 중고 상급이 더 합리적인가요?','고속 안정감은 디젤이 아직 낫다는 말이 맞나요?','차량 유지비에서 보험료 차이가 생각보다 크네요.','옵션은 어디까지 넣는 게 후회가 적을까요?','겨울철 하이브리드 연비 하락이 실제로 큰가요?','중고차 볼 때 사고 이력보다 더 중요한 게 있을까요?','패밀리카는 승차감이랑 적재공간 중 뭐가 우선일까요?','출고 대기 길면 재고차로 가는 것도 방법일까요?','전기차 넘어가기 전에 하이브리드가 좋은 징검다리 같네요.','타이어만 바꿔도 노면소음 차이가 많이 나나요?','도심 주행 위주면 가솔린 터보는 부담될까요?','장거리 많으면 시트 편한 게 제일 중요한 듯합니다.','차박까지 보면 어느 등급부터 봐야 할까요?','감가 생각하면 인기 색상으로 가는 게 맞겠죠?','운전 보조 옵션 실제 만족도 어떤가요?','가족 태우는 차는 결국 정숙성이더라고요.'];
const replies=['실오너 기준으로 보면 수치보다 주행 환경 차이가 더 큽니다.','저도 같은 고민했는데 시승 두 번 해보니 답이 빨리 나오더라고요.','가격만 보면 비싸 보이지만 유지비까지 넣으면 계산이 달라집니다.','옵션은 안전 관련만큼은 빼면 나중에 계속 생각납니다.','도심 비중이 높으면 하이브리드 만족도가 확실히 올라갑니다.','고속 위주면 연비보다 피로감이 더 중요하다고 봅니다.','중고는 매물 상태가 등급보다 먼저입니다.','가족이 타면 뒷좌석 승차감부터 확인하는 게 맞습니다.','겨울에는 공조랑 예열 때문에 수치가 내려가는 편입니다.','타이어 공기압만 맞춰도 체감이 은근히 납니다.','보험료는 연령이랑 사고 이력이 커서 견적 먼저 뽑아보세요.','재고차는 할인 조건만 좋으면 충분히 볼 만합니다.','전기차 충전 스트레스 있으면 하이브리드가 편합니다.','시승할 때 같은 길을 달려보면 소음 차이가 바로 느껴집니다.','감가는 흰색 검정 회색이 확실히 방어가 됩니다.','트렁크 유모차 넣어보면 차급 차이가 바로 납니다.','HUD랑 통풍은 한 번 쓰면 다음 차에도 넣게 됩니다.','디젤은 장거리 많을 때 장점이 아직 남아 있습니다.','가솔린 터보는 정숙성은 좋은데 연료비 계산은 해야 합니다.','결국 본인 주행 패턴을 적어보는 게 제일 정확합니다.'];
const tails=['제 기준에서는 만족입니다.','다만 예산이 변수네요.','시승은 꼭 해보세요.','가족 반응도 중요합니다.','숫자만 보면 판단이 어렵습니다.','실사용에서는 차이가 꽤 납니다.','장거리 한 번 타보면 감이 옵니다.','유지비까지 같이 봐야 합니다.','매물 상태가 제일 중요합니다.','개인차는 확실히 있습니다.'];
function avatarFor(i){const gender=i%2?'women':'men';const n=(i*7+13)%99;return `https://randomuser.me/api/portraits/${gender}/${n}.jpg`}
function makeText(i,depth){if(depth===0)return roots[(i/9|0)%roots.length];const base=replies[(i*3+depth)%replies.length];const tail=tails[(i+depth*5)%tails.length];return depth>=3?`${base} ${tail} 3뎁스 이후는 같은 폭으로 이어가도 읽히네요.`:`${base} ${tail}`}
function buildComments(total=200){const items=[],latest=[null,null,null,null,null];for(let i=0;i<total;i++){let slot=i%9;let depth=slot===0?0:slot===1||slot===2||slot===5?1:slot===3||slot===6?2:slot===4||slot===7?3:4;if(!latest[depth-1])depth=0;const parentId=depth?latest[depth-1]:null;const item={id:i+1,parentId,depth,author:names[(i*5+depth)%names.length],time:i<1?'방금 전':`${i+2}분 전`,avatar:avatarFor(i),text:makeText(i,depth),up:(i*7+depth*3)%86,down:(i*2+depth)%9};items.push(item);latest[depth]=item.id;for(let d=depth+1;d<latest.length;d++)latest[d]=null}return items}
let all=buildComments(200),sort='newest',filter='all',collapsedAll=false;
const comments=document.getElementById('comments'),sortBtn=document.getElementById('sortBtn'),totalCount=document.getElementById('totalCount');
function childrenOf(parentId){return all.filter(item=>item.parentId===parentId)}
function visibleByFilter(item){if(filter==='root')return item.depth===0;if(filter==='deep')return item.depth>0;return true}
function renderAvatar(item){const initial=item.author.slice(0,1);return `<div class="avatar"><img src="${item.avatar}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=avatar-fallback>${initial}</span>'"></div>`}
function renderComment(item){const kids=childrenOf(item.id);const visible=visibleByFilter(item);const visualDepth=Math.min(item.depth,3);const badge=item.depth===0?'<span class="badge root">원댓글</span>':`<span class="badge ${item.depth>3?'depth-cap':''}">${item.depth>3?'4뎁스+':item.depth+'뎁스'}</span>`;const html=`<article class="comment ${item.depth?'reply':''} ${visible?'':'is-hidden'}" data-id="${item.id}" data-depth="${item.depth}">${renderAvatar(item)}<div><div class="meta"><span class="name">${item.author}</span><span class="time">${item.time}</span>${badge}</div><p class="text">${item.text}</p><div class="actions"><button class="vote up" type="button" data-vote="up" data-count="${item.up}" aria-pressed="false" aria-label="좋아요"><span class="thumb" aria-hidden="true">👍</span><b>${item.up||''}</b></button><button class="vote down" type="button" data-vote="down" data-count="${item.down}" aria-pressed="false" aria-label="싫어요"><span class="thumb" aria-hidden="true">👎</span><b>${item.down||''}</b></button><button class="reply-action" type="button">답글</button>${kids.length?`<button class="collapse-one" type="button" data-toggle="${item.id}">접기</button>`:''}</div></div></article>`;if(!kids.length)return html;const groupClass=item.depth>=3?'level-over':`level-${visualDepth+1}`;return html+`<div class="reply-group ${groupClass}" data-children-of="${item.id}">${kids.map(renderComment).join('')}</div>`}
function render(){let roots=childrenOf(null);if(sort==='best')roots=[...roots].sort((a,b)=>(b.up-b.down)-(a.up-a.down));else roots=[...roots].sort((a,b)=>b.id-a.id);comments.innerHTML=roots.map(renderComment).join('')+`<p class="notice">총 200개 댓글 시나리오. 원댓글, 대댓글, 대대댓글, 4뎁스 이상을 포함하고 3뎁스 이후는 같은 폭으로 유지합니다.</p>`;totalCount.textContent=filter==='all'?200:all.filter(visibleByFilter).length;bindControls();if(collapsedAll)document.querySelectorAll('.reply-group').forEach(g=>g.classList.add('is-hidden'))}
function bindControls(){document.querySelectorAll('.vote').forEach(button=>button.addEventListener('click',()=>{const sibling=button.parentElement.querySelector(button.dataset.vote==='up'?'.down':'.up');const active=!button.classList.contains('active');if(sibling.classList.contains('active'))toggleVote(sibling,false);toggleVote(button,active)}));document.querySelectorAll('[data-toggle]').forEach(button=>button.addEventListener('click',()=>{const target=document.querySelector(`[data-children-of="${button.dataset.toggle}"]`);if(!target)return;const hidden=target.classList.toggle('is-hidden');button.textContent=hidden?'펼치기':'접기'}))}
function toggleVote(button,active){let count=Number(button.dataset.count||0);count=Math.max(0,count+(active?1:-1));button.dataset.count=count;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));button.querySelector('b').textContent=count||''}
sortBtn.addEventListener('click',()=>{sort=sort==='newest'?'best':'newest';sortBtn.textContent=sort==='newest'?'최신순⌄':'추천순⌄';render()});document.querySelectorAll('.chip[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.chip[data-filter]').forEach(b=>b.classList.remove('active'));button.classList.add('active');filter=button.dataset.filter;render()}));document.getElementById('collapseAll').addEventListener('click',e=>{collapsedAll=!collapsedAll;e.currentTarget.textContent=collapsedAll?'전체 펼치기':'전체 접기';document.querySelectorAll('.reply-group').forEach(g=>g.classList.toggle('is-hidden',collapsedAll));document.querySelectorAll('.collapse-one').forEach(b=>b.textContent=collapsedAll?'펼치기':'접기')});
render();
</script>
</body>
</html>
