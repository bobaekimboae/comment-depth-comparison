 span{display:block;margin-top:2px;color:var(--sub);font-size:11.5px;font-weight:800}.screen{padding:0 12px 92px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}.toolbar h2{margin:0;font-size:20px;letter-spacing:-.045em}.sort{border:0;background:transparent;color:var(--blue);font-weight:900}.list{display:grid;gap:9px}.post{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 13px 12px;box-shadow:0 1px 0 rgba(16,24,40,.02)}.post.compact{border-radius:0;border-left:0;border-right:0;border-top:0;box-shadow:none}.postHead{display:flex;align-items:flex-start;gap:9px}.avatar{width:36px;height:36px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:#e8edf3}.avatar.small{width:25px;height:25px}.postBody{min-width:0;flex:1}.meta{display:flex;align-items:center;gap:5px;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nick{color:#10141a;font-weight:900}.chip{display:inline-flex;align-items:center;height:20px;border-radius:999px;padding:0 7px;background:#f1f6ff;color:var(--blue);font-size:11px;font-weight:900}.postTitle{margin:6px 0 5px;font-size:17px;line-height:1.34;font-weight:900;letter-spacing:-.035em}.postText{margin:0;color:#2a3038;font-size:14.5px;line-height:1.52;word-break:keep-all}.thumbs{display:flex;gap:6px;margin-top:9px}.thumb{width:68px;height:48px;border-radius:10px;object-fit:cover;background:#edf1f5}.postFoot{display:flex;align-items:center;gap:14px;margin-top:11px;color:#68717d;font-size:12.5px;font-weight:850}.footItem{display:inline-flex;align-items:center;gap:4px}.detail{display:none}.detail.show{display:block}.detailTop{position:sticky;top:126px;z-index:10;margin:0 -12px 10px;padding:8px 12px;background:rgba(245,246,248,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.back{width:36px;height:36px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:20px}.detailTitle{flex:1;font-size:16px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.article{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}.article h2{font-size:21px;line-height:1.32;letter-spacing:-.045em;margin:10px 0}.article p{font-size:16px;line-height:1.72;word-break:keep-all;margin:10px 0}.articleImg{width:100%;border-radius:16px;margin:10px 0;display:block}.articleStats{display:flex;gap:18px;border-top:1px solid var(--line);margin-top:14px;padding-top:13px;color:#5e6875;font-weight:900}.comments{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}.commentHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.commentHead b{font-size:19px;letter-spacing:-.04em}.composer{display:flex;gap:8px;padding:8px;background:#f7f8fa;border:1px solid var(--line);border-radius:16px;margin-bottom:12px}.composer input{flex:1;border:0;background:transparent;outline:none;font-size:14px}.composer button{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:0 12px;font-weight:900}.thread{position:relative}.comment{position:relative;padding:9px 0 10px}.comment:not(:last-child){border-bottom:1px solid #f0f2f5}.commentRow{display:grid;grid-template-columns:32px 1fr;gap:8px}.depth1 .commentRow,.depth2 .commentRow,.depth3 .commentRow{grid-template-columns:25px 1fr}.commentContent{min-width:0}.commentMeta{display:flex;align-items:center;gap:5px;color:#8a929d;font-size:12.5px}.commentText{font-size:14.5px;line-height:1.55;margin:4px 0 7px}.mention{color:var(--blue);font-weight:800}.commentActions{display:flex;align-items:center;gap:13px;color:#66717d;font-size:12.5px;font-weight:900}.icoBtn{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:#66717d;padding:0}.icoBtn.on{color:var(--blue)}.collapse{width:22px;height:22px;border:1px solid #d7dde5;background:#fff;border-radius:50%;color:#73808d;font-size:16px;line-heig itle{font-size:17.5px}@media(max-width:420px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.detailTop{top:128px}.article h2{font-size:20px}.screen{padding-left:10px;padding-right:10px}.top{padding-left:10px;padding-right:10px}.children{margin-left:16px;padding-left:10px}.postTitle{font-size:16.5px}}

<body class="boba"><div class="app"><header class="top"><div class="brand"><div class="logo">보</div><div class="brandText"><h1>보배 커뮤니티 시스템</h1><p>목록 · 상세 · 글쓰기 · 댓글 시스템 통합 시안</p></div></div><nav id="typeTabs" class="typeTabs"></nav><div class="search"><input id="search" placeholder="차종, 연비, 정비비, 게시글 검색"><button id="writeOpen" class="writeBtn">글쓰기</button></div><nav id="subTabs" class="subTabs"></nav></header><section class="summary"><div class="stat"><b id="statPosts">0</b><span>게시글</span></div><div class="stat"><b id="statComments">0</b><span>댓글</span></div><div class="stat"><b id="statLikes">0</b><span>추천</span></div><div class="stat"><b>4</b><span>유형</span></div></section><main class="screen"><section id="listScreen"><div class="toolbar"><h2 id="boardName">전체 게시글</h2><button id="sort" class="sort">인기순</button></div><div id="postList" class="list"></div></section><section id="detailScreen" class="detail"></section><section id="writeScreen" class="write"><div class="detailTop"><button class="back" id="writeBack">‹</button><div class="detailTitle">글쓰기</div></div><div class="writeCard"><div class="field"><label>게시판 유형</label><select id="writeType"><option value="boba">보배형</option><option value="naver">네이버 카페형</option><option value="chzzk">치지직형</option><option value="thread">스레드 댓글형</option></select></div><div class="field"><label>말머리</label><input id="writeCat" placeholder="예: 국산차, 수입차, 전기차, 정비"></div><div class="field"><label>제목</label><input id="writeTitle" placeholder="게시글 제목"></div><div class="field"><label>본문</label><textarea id="writeBody" placeholder="차량 경험, 정비 후기, 질문 내용을 입력"></textarea></div><div class="writeActions"><button id="cancelWrite">취소</button><button id="submitWrite" class="submit">등록</button></div></div></section></main><nav class="bottom"><button class="navBtn on" data-nav="list">목록</button><button class="navBtn" data-nav="write">글쓰기</button><button class="navBtn" data-nav="comments">댓글형</button></nav></div><div id="toast" class="toast"></div><script>

function load(){const saved=localStorage.getItem(KEY);return saved?JSON.parse(saved):{type:'boba',board:'전체',sort:'popular',posts:seedPosts,selected:null,view:'list'}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}let state=load();const $=s=>document.querySelector(s);function render(){document.body.className=state.type;renderTabs();renderStats();if(state.view==='detail')renderDetail();else if(state.view==='write')renderWrite();else renderList();document.querySelectorAll('.navBtn').forEach(b=>b.classList.toggle('on',b.dataset.nav===state.view||b.dataset.nav==='list'&&state.view==='detail'))}
function renderTabs(){typeTabs.innerHTML=types.map(t=>`<button class="tab ${state.type===t[0]?'on':''}" data-type="${t[0]}">${t[1]}</button>`).join('');subTabs.innerHTML=boards.map(b=>`<button class="subtab ${state.board===b?'on':''}" data-board="${b}">${b}</button>`).join('');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;state.view='list';save();render()});document.querySelectorAll('[data-board]').forEach(b=>{b.onclick=()=>{state.board=b.dataset.board;state.view='list';save();render()}})}
function allComments(list){let n=0;list.forEach(c=>{n++;if(c.children)n+=allComments(c.children)});return n}
function renderStats(){statPosts.textContent=state.posts.length;statComments.textContent=state.posts.reduce((a,p)=>a+allComments(p.comments),0);statLikes.textContent=state.posts.reduce((a,p)=>a+p.likes,0)}
function filteredPosts(){const q=search.value.trim();let arr=state.posts.filter(p=>(state.board==='전체'||p.cat===state.board)&&(state.type==='boba'||p.type===state.type||state.type==='thread'));if(q)arr=arr.filter(p=>(p.title+p.body+p.author+p.cat).includes(q));return [...arr].sort((a,b)=>state.sort==='new'?b.id-a.id:b.likes-a.likes)}
function postCard(p){return `<article class="post ${state.type==='naver'||state.type==='chzzk'?'compact':''}" data-post="${p.id}"><div class="postHead"><img class="avatar" src="${avatars[p.id%avatars.length]}"><div class="postBody"><div class="meta"><span class="nick">${p.author}</span><span>·</span><span>${p.time}</span><span class="chip">${p.cat}</span></div><h3 class="postTitle">${p.title}</h3><p class="postText">${p.body}</p>${p.imgs?.length?`<div class="thumbs">${p.imgs.map(i=>`<img class="thumb" src="${i}">`).join('')}</div>`:''}<div class="postFoot"><span class="footItem">조회 ${p.views.toLocaleString()}</span><span class="footItem">추천 ${p.likes}</span><span class="footItem">댓글 ${allComments(p.comments)}</span></div></div></div></article>`}
function renderList(){listScreen.style.display='block';detailScreen.classList.remove('show');writeScreen.classList.remove('show');boardName.textContent=state.board==='전체'?'전체 게시글':state.board;postList.innerHTML=filteredPosts().map(postCard).join('')||'<div class="post">검색 결과가 없습니다.</div>';document.querySelectorAll('[data-post]').forEach(el=>el.onclick=()=>{state.selected=Number(el.dataset.post);state.view='detail';save();render()})}
function renderWrite(){listScreen.style.display='none';detailScreen.classList.remove('show');writeScreen.classList.add('show');writeType.value=state.type;writeCat.value=state.board==='전체'?'':state.board;writeTitle.value='';writeBody.value=''}
function findPost(){return state.posts.find(p=>p.id===state.selected)||state.posts[0]}
function renderDetail(){const p=findPost();listScreen.style.display='none';writeScreen.classList.remove('show');detailScreen.classList.add('show');detailScreen.innerHTML=`<div class="detailTop"><button class="back" id="backList">‹</button><div class="detailTitle">${p.title}</div></div><article class="article"><div class="meta"><span class="nick">${p.author}</span><span>·</span><span>${p.time}</span><span class="chip">${p.cat}</span></div><h2>${p.title}</h2>${p.imgs?.length?`<img class="articleImg" src="${p.imgs[0]}">`:''}<p>${p.body}</p><div class="articleStats"><span>조회 ${p.views.toLocaleString()}</span><span>추천 ${p.likes}</span><span>댓글 ${allComments(p.comments)}</span></div></article><section class="comments"><div class="commentHead"><b>댓글 ${allComments(p.comments)}</b><button class="sort">최신순</button></div><div class="composer"><input id="newComment" placeholder="댓글을 남겨보세요"><button id="addComment">등록</button></div><div class="thread">${renderComments(p.comments,0,p.author)}</div></section>`;$('#backList').onclick=()=>{state.view='list';save();render()};$('#addComment').onclick=()=>{const v=$('#newComment').value.trim();if(!v)return; p.comments.unshift({id:Date.now()+'',author:'내댓글',text:v,likes:0,dislikes:0,children:[]});save();render();toast('댓글 등록됨')};bindCommentActions(p)}
function renderComments(comments,depth,parent){return comments.map(c=>{const hidden=c.collapsed?'hidden':'';const has=c.children&&c.children.length;return `<div class="comment depth${depth}"><div class="commentRow"><img class="avatar ${depth?'small':''}" src="${avatars[Math.abs(hash(c.author))%avatars.length]}"><div class="commentContent"><div class="commentMeta"><span class="nick">${c.author}</span><span>·</span><span>${depth?depth+'뎁스':'원댓글'}</span><button class="icoBtn more" data-more="${c.id}">···</button></div><div class="commentText">${c.text.replace(/@([가-힣A-Za-z0-9_]+)/g,'<span class="mention">@$1</span>')}</div><div class="commentActions">${has?`<button class="collapse" data-collapse="${c.id}">${c.collapsed?'+':'−'}</button>`:''}<button class="icoBtn" data-like="${c.id}">👍 <span>${c.likes}</span></button><button class="icoBtn" data-dislike="${c.id}">👎</button><button class="icoBtn" data-reply="${c.id}">💬 답글</button></div>${has?`<div class="children ${hidden}">${renderComments(c.children,depth+1,c.author)}</div>`:''}</div></div></div>`}).join('')}
function walk(comments,id,fn){for(const c of comments){if(c.id==id){fn(c);return true}if(c.children&&walk(c.children,id,fn))return true}return false}
function bindCommentActions(p){document.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=e=>{e.stopPropagation();walk(p.comments,b.dataset.collapse,c=>c.collapsed=!c.collapsed);save();render()});document.querySelectorAll('[data-like]').forEach(b=>b.onclick=e=>{e.stopPropagation();walk(p.comments,b.dataset.like,c=>c.likes++);save();render()});document.querySelectorAll('[data-dislike]').forEach(b=>b.onclick=e=>{e.stopPropagation();walk(p.comments,b.dataset.dislike,c=>c.dislikes++);save();render()});document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=e=>{e.stopPropagation();const text=prompt('답글 입력');if(!text)return;walk(p.comments,b.dataset.reply,c=>{c.children=c.children||[];c.children.push({id:Date.now()+'',author:'내댓글',text,likes:0,dislikes:0,children:[]})});save();render();toast('답글 등록됨')})}
function hash(s){return [...s].reduce((a,ch)=>a+ch.charCodeAt(0),0)}function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1300)}
writeOpen.onclick=()=>{state.view='write';save();render()};writeBack.onclick=cancelWrite.onclick=()=>{state.view='list';save();render()};submitWrite.onclick=()=>{if(!writeTitle.value.trim()||!writeBody.value.trim()){toast('제목과 본문 필요');return}state.posts.unshift({id:Date.now(),type:writeType.value,cat:writeCat.value.trim()||'자유',title:writeTitle.value.trim(),body:writeBody.value.trim(),author:'보배회원',time:'방금 전',views:0,likes:0,dislikes:0,imgs:[],comments:[]});state.type=writeType.value;state.board='전체';state.view='list';save();render();toast('게시글 등록됨')};search.oninput=render;sort.onclick=()=>{state.sort=state.sort==='popular'?'new':'popular';sort.textContent=state.sort==='popular'?'인기순':'최신순';save();render()};document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='write')state.view='write';else if(b.dataset.nav==='comments'){state.type='thread';state.view='detail';state.selected=1}else state.view='list';save();render()});render();
</script></body></html>
