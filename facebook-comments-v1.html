<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>페이스북 댓글 UI · 보배 자동차 토론</title>
<style>
:root{--ink:#111827;--muted:#6f7780;--line:#e4e6eb;--blue:#1877f2;--back:#969696}*{box-sizing:border-box}body{margin:0;background:var(--back);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}.phone{max-width:760px;margin:auto;min-height:100vh;background:var(--back);display:flex;align-items:flex-end}.sheet{position:relative;width:100%;min-height:calc(100vh - 64px);max-height:calc(100vh - 64px);background:#fff;border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column}.grab{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:74px;height:6px;border-radius:99px;background:#8f9398}.summary{padding:38px 22px 22px;display:flex;align-items:center;justify-content:space-between;font-size:21px;line-height:28px;font-weight:750;letter-spacing:-.02em}.react{display:flex;align-items:center;gap:7px;min-width:0}.bubble{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:15px;font-weight:800;border:2px solid #fff;margin-right:-9px}.likeBubble{background:#1877f2}.loveBubble{background:#f45278}.share{font-weight:700;white-space:nowrap}.sort{padding:0 22px 18px;font-size:20px;line-height:26px;font-weight:760;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}.sort:after{content:'';width:10px;height:10px;border-right:3px solid #111;border-bottom:3px solid #111;transform:rotate(45deg) translateY(-3px)}.feed{flex:1;overflow:auto;padding:0 22px 88px}.comment{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:14px;padding:17px 0 10px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#e5e7eb}.avatar.placeholder{display:grid;place-items:center;background:#d9dde2;color:#6b727a;font-size:23px}.main{min-width:0}.head{font-size:17px;line-height:22px;font-weight:750;letter-spacing:-.015em;color:#111;display:flex;align-items:center;gap:6px}.time{color:#6c737c;font-weight:420}.text{font-size:22px;line-height:1.36;letter-spacing:-.025em;font-weight:400;margin:6px 0 0;color:#111;word-break:keep-all}.actions{height:34px;margin-top:13px;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;column-gap:22px;color:#6b7178}.replyAction{font-size:16px;line-height:20px;font-weight:750;color:#6a6f76}.count{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:18px;line-height:22px;font-weight:650;color:#6a6f76}.countIcon{width:25px;height:25px;border-radius:50%;background:#1c8df6;color:#fff;display:grid;place-items:center;border:2px solid #fff}.rightIcon{width:32px;height:32px;display:grid;place-items:center;color:#666d75}.rightIcon svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.viewReplies{grid-column:2/3;justify-self:start;margin:4px 0 0;border:0;background:transparent;color:#666d75;font-size:17px;line-height:22px;font-weight:760;padding:0;display:inline-flex;align-items:center;gap:7px}.viewReplies:before{content:'';width:9px;height:9px;border-right:2.5px solid #666d75;border-bottom:2.5px solid #666d75;transform:rotate(45deg) translateY(-2px)}.replies{grid-column:2/3;position:relative;margin-top:12px;padding-left:22px}.replies:before{content:'';position:absolute;left:0;top:0;bottom:12px;width:3px;background:#e4e6eb;border-radius:99px}.replyNode{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:11px;padding:9px 0 14px}.replyNode:before{content:'';position:absolute;left:-22px;top:22px;width:22px;height:24px;border-left:3px solid #e4e6eb;border-bottom:3px solid #e4e6eb;border-bottom-left-radius:18px}.replyNode .avatar{width:32px;height:32px}.replyNode .head{font-size:16px;line-height:21px}.replyNode .text{font-size:21px;line-height:1.36;margin-top:5px}.mention{color:#0866c6;font-weight:780}.replyNode .actions{margin-top:11px;height:30px}.replyNode .replyAction{font-size:15px}.replyNode .count{font-size:16px}.replyNode .countIcon{width:23px;height:23px}.moreDeep{margin:2px 0 0 43px;border:0;background:transparent;color:#666d75;font-size:17px;font-weight:760;padding:0}.hidden{display:none}.composer{position:absolute;left:0;right:0;bottom:0;height:72px;background:rgba(255,255,255,.97);border-top:1px solid #ddd;display:flex;align-items:center;padding:10px 22px}.input{width:100%;height:48px;border-radius:999px;background:#f0f2f5;color:#6f7780;display:flex;align-items:center;padding:0 22px;font-size:21px;line-height:48px;font-weight:400;letter-spacing:-.02em}@media(max-width:520px){.summary{font-size:20px;padding-left:20px;padding-right:20px}.sort{font-size:20px;padding-left:22px}.feed{padding-left:22px;padding-right:20px}.comment{grid-template-columns:48px minmax(0,1fr);column-gap:14px}.text{font-size:21px}.replyNode .text{font-size:20px}.actions{column-gap:18px}.input{font-size:20px}}
</style>
</head>
<body><main class="phone"><section class="sheet"><div class="grab"></div><header class="summary"><div class="react"><span class="bubble likeBubble">👍</span><span class="bubble loveBubble">♥</span><span>김용남님 외 3,730명</span></div><div class="share">공유 49회</div></header><div class="sort">관련성 높은 댓글</div><section id="feed" class="feed"></section><footer class="composer"><div class="input">Bobae Kim(으)로 댓글 달기</div></footer></section></main><script>
const imgs=['https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=120&q=80','https://images.unsplash.com/photo-1592853625511-ad0edcc69c07?auto=format&fit=crop&w=120&q=80'];
const names=['정비소삼촌','Jaehong Kim','Seong Jin Park','로치오','김인아','Donghee Kim','정성환','윤희조','최재영','김정근','SA Jang','김은선','Yongki An','Izbel Yang','김우석','이점석','hanjoout','윤창진','정대희','카니발아빠'];
const texts=['응원합니다','쏘렌토랑 싼타페는 실제로 짐 넣어보면 답이 빨리 나옵니다.','그래서 2열 시승은 해보셨나요?','근데 왜 옵션표만 보고 결정해요? ㅋ 실차 봐야죠','고마좀 하세요. 유지비까지 같이 계산해야 합니다','뭘 먼저 봐야 하는지 정리하면 연비보다 주행 패턴입니다','그렇게 잘 좀 비교하시지…지난번엔 트렁크만 보고 골랐네요','패밀리 SUV면 가족이 뒤에 앉아본 반응이 제일 정확합니다','절대 디젤 안 가죠. 아니 못 가쥬','그건 아닌듯ㅠㅠ 겨울 연비도 봐야죠','시내 정체가 많으면 하브 체감이 확실합니다','중고가 방어는 인기 트림과 색상이 크게 갑니다','여기저기 후기만 보면 헷갈립니다. 직접 시승이 답입니다','네네 너나 잘해 말고 실제 연비 인증 좀','정비이력 없으면 아무리 싸도 피합니다','내야는 정신과의사보다 정비사가 먼저 필요하겠네요 ㅎㅎ','배터리 보증은 본인이 먼저 확인해야 될듯.','ㅋㅋ 이런게 실차주 후기라 도움됩니다','1년동안 타본 입장에서는 시내면 하브 추천합니다','중고차 얘기로 치면 옵션만 말하고 정비이력은 안 보는 느낌입니다'];
const replyTexts=['당신보다 더 꼼꼼하게 차 보고 말하는 겁니다. 실차부터 보세요.','제발 카탈로그만 보고 판단하지 마시길','참 답답하네요. 트림보다 가족 동선이 먼저입니다.','네네 너나 잘해도 시승은 해야죠','흘룽ㅋㅋㅋㅋ 이런 선택 때문에 1년이 힘들었지','의견은 많은데 실측 사진이 제일 정확합니다','그건 아닌듯ㅠㅠ 중고가도 중요합니다','팩트라고 떠들려면 연비 인증부터 보자','절대 안가죠. 아니 못가쥬','승차감은 숫자로 안 나옵니다'];
const likeIcon='<svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.3a2 2 0 0 0 2-1.7l1.4-9a2 2 0 0 0-2-2.3H14zM7 22H3V11h4v11z"/></svg>';
const dislikeIcon='<svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9A2 2 0 0 0 4.3 15H10zM17 2h4v11h-4V2z"/></svg>';
function av(i){return `<img class="avatar" src="${imgs[i%imgs.length]}" alt="">`}
function count(n){return `<span class="count"><span class="countIcon">👍</span>${n||''}</span>`}
function actionRow(n){return `<div class="actions"><span class="replyAction">답글 달기</span>${count(n)}<span class="rightIcon">${likeIcon}</span><span class="rightIcon">${dislikeIcon}</span></div>`}
function replyNode(parent,i,depth=1){const nm=names[(i+3)%names.length];const tx=replyTexts[i%replyTexts.length];const target=depth>1?names[(i+1)%names.length]:parent;return `<article class="replyNode">${av(i+3)}<div><div class="head">${nm}<span class="time">· ${i%5===0?'20시간':'1일'}</span></div><div class="text"><span class="mention">${target}</span> ${tx}</div>${actionRow((i*2+3)%13)}</div></article>`}
function repliesBlock(parent,i,total){let html=`<div class="replies hidden" id="replies-${i}">`;const shown=Math.min(total,i%4===0?5:3);for(let j=0;j<shown;j++)html+=replyNode(parent,i+j,j>0?2:1);if(total>shown)html+=`<button class="moreDeep">답글 ${total-shown}개 보기</button>`;html+='</div>';return html}
function comment(i){const nm=names[i%names.length];const hasReplies=i%3!==0;const total=2+(i*2)%7;return `<article class="comment"><div>${i%11===3?'<div class="avatar placeholder">●</div>':av(i)}</div><div class="main"><div class="head">${nm}<span class="time">· ${i%6===0?'2일':'1일'}</span></div><div class="text">${texts[i%texts.length]}</div>${actionRow((i*13)%170)}${hasReplies?`<button class="viewReplies" data-target="replies-${i}" data-total="${total}">답글 ${total}개 보기</button>${repliesBlock(nm,i,total)}`:''}</div></article>`}
feed.innerHTML=Array.from({length:80},(_,i)=>comment(i)).join('');document.querySelectorAll('.viewReplies').forEach(btn=>btn.onclick=()=>{const el=document.getElementById(btn.dataset.target);const open=!el.classList.toggle('hidden');btn.textContent=open?'답글 닫기':`답글 ${btn.dataset.total}개 보기`});
</script></body></html>
