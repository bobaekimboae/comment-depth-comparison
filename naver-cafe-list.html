function render(){list.innerHTML=posts.map(p=>{const rank=p.rank?`<img class="rankIcon" src="${rankImages[p.rank]}" alt="계급">`:'';const thumb=p.img?`<div class="thumbWrap"><img class="thumb" src="${p.img}" alt="${p.title} 썸네일">${p.photos?`<span class="photoBadge">${p.photos}+</span>`:''}${p.video?'<span class="play"></span>':''}</div>`:'';return `<article class="item ${p.img?'':'noThumb'} ${p.fresh?'isFresh':''}"><span class="dot"></span><div class="body"><div class="itemTitle">${p.title}</div><div class="meta">${rank}<span>${p.user}</span><span>${p.time}</span><span>${p.view}</span></div></div>${thumb}<button class="commentBox" type="button"><b>${p.reply}</b><span>댓글</span></button></article>`}).join('')}
render();
