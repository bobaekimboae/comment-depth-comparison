<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>네이버 카페 목록형 원본 재현</title>
<style>
:root{--red:#bd2034;--ink:#111;--muted:#8f8f94;--line:#eeeeef;--soft:#f6f7f9;--chip:#f3f4f6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;border:0;background:none}.phone{width:100%;max-width:430px;margin:0 auto;background:#fff;min-height:100dvh;position:relative;overflow:hidden}.status{height:34px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:14px;font-weight:700;letter-spacing:-.02em}.status .right{display:flex;gap:5px;align-items:center;opacity:.94}.appbar{height:70px;background:var(--red);color:#fff;display:flex;align-items:center;gap:18px;padding:0 17px}.back{width:22px;height:22px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(45deg);flex:0 0 auto}.title{font-size:21px;font-weight:900;letter-spacing:-.055em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.searchIcon{width:30px;height:30px;border:3px solid #fff;border-radius:50%;position:relative;flex:0 0 auto}.searchIcon:after{content:"";position:absolute;width:13px;height:3px;background:#fff;right:-9px;bottom:0;transform:rotate(45deg);border-radius:99px}.menu{width:31px;height:24px;display:grid;gap:6px;flex:0 0 auto}.menu span{height:3px;background:#fff;border-radius:999px}.boardTop{height:76px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #fafafa}.boardPill{height:45px;border-radius:24px;background:var(--red);color:#fff;display:flex;align-items:center;padding:0 15px;font-size:19px;font-weight:700;letter-spacing:-.04em;white-space:nowrap}.noticePill{height:45px;border:1px solid #e5e5e7;border-radius:24px;background:#fff;color:#111;padding:0 20px;font-size:18px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.03);white-space:nowrap}.subscribe{margin-left:auto;display:flex;align-items:center;gap:7px;color:#555;font-size:17px;font-weight:800;white-space:nowrap}.check{width:16px;height:9px;border-left:3px solid #606066;border-bottom:3px solid #606066;transform:rotate(-45deg);margin-top:-4px}.gridIcon{width:24px;height:24px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-left:8px}.gridIcon span{background:#9a9a9d;border-radius:2px}.category{height:70px;display:flex;align-items:center;gap:22px;overflow-x:auto;padding:0 18px;border-bottom:1px solid #f5f5f6;scrollbar-width:none}.category::-webkit-scrollbar{display:none}.cat{height:42px;border-radius:23px;padding:0 17px;color:#8d8d92;font-size:17px;font-weight:650;white-space:nowrap}.cat.on{background:#f3f4f6;color:#19191d}.noticeRow{height:60px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);gap:10px}.noticeBadge{height:27px;border-radius:999px;background:#fff3f4;color:#ee3b45;display:inline-flex;align-items:center;padding:0 10px;font-size:15px;font-weight:900}.noticeText{font-size:18px;font-weight:900;letter-spacing:-.045em}.list{padding-left:18px}.item{min-height:78px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 52px;gap:10px;align-items:center;padding:13px 18px 13px 0;position:relative}.item.noThumb{grid-template-columns:1fr 52px}.dot{position:absolute;left:-12px;top:28px;width:5px;height:5px;border-radius:50%;background:#ff2d3d}.body{min-width:0}.itemTitle{font-size:18px;line-height:1.32;font-weight:520;letter-spacing:-.045em;color:#111;word-break:keep-all}.meta{margin-top:5px;display:flex;align-items:center;gap:5px;color:#99999d;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden}.level{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;border-radius:3px;background:#a66deb;color:#fff;font-size:10px;font-weight:900;line-height:1}.level.blue{background:#63a5ff}.thumb{width:64px;height:64px;border-radius:13px;object-fit:cover;background:#e9edf2;display:block}.thumbWrap{position:relative}.play{position:absolute;left:50%;top:50%;transform:translate(-42%,-50%);width:0;height:0;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}.commentBox{width:52px;height:64px;border-radius:17px;background:#f6f7f9;color:#17191d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900}.commentBox b{font-size:17px}.commentBox span{font-size:13px;color:#888b91;font-weight:700}.fab{position:fixed;right:max(18px,calc((100vw - 430px)/2 + 18px));bottom:calc(22px + env(safe-area-inset-bottom));width:68px;height:68px;border-radius:50%;background:var(--red);box-shadow:0 8px 20px rgba(189,32,52,.28);display:grid;place-items:center;z-index:20}.pen{width:30px;height:30px;position:relative}.pen:before{content:"";position:absolute;width:23px;height:7px;border:3px solid #fff;border-radius:5px;transform:rotate(-45deg);left:3px;top:6px}.pen:after{content:"";position:absolute;width:28px;height:3px;background:#fff;left:2px;bottom:4px;border-radius:99px}.bottomSpace{height:24px}@media(max-width:370px){.title{font-size:19px}.boardTop{gap:9px;padding:0 14px}.boardPill{font-size:17px;padding:0 12px}.noticePill{font-size:16px;padding:0 15px}.subscribe{font-size:15px}.category{gap:15px;padding:0 14px}.cat{font-size:16px;padding:0 14px}.itemTitle{font-size:17px}.item{grid-template-columns:1fr auto 50px;padding-right:14px}.thumb{width:58px;height:58px}.commentBox{width:50px;height:60px}.list{padding-left:16px}}
</style>
</head>
<body>
<main class="phone">
  <div class="status"><span>4:52</span><span class="right">◌ ◔ ⌁ 43</span></div>
  <header class="appbar"><div class="back"></div><div class="title">테슬라코리아클럽 TKC</div><div class="searchIcon"></div><div class="menu"><span></span><span></span><span></span></div></header>
  <section class="boardTop"><button class="boardPill">☰ 자유게시판 ☰</button><button class="noticePill">공지</button><div class="subscribe"><span class="check"></span><span>구독중</span></div><div class="gridIcon"><span></span><span></span><span></span><span></span></div></section>
  <nav class="category"><button class="cat on">전체</button><button class="cat">유머</button><button class="cat">뻘글</button><button class="cat">SOS</button><button class="cat">고민상담</button><button class="cat">공감구걸</button></nav>
  <section class="noticeRow"><span class="noticeBadge">공지</span><span class="noticeText">리퍼럴 홍보 안내</span></section>
  <section id="list" class="list"></section>
  <div class="bottomSpace"></div>
  <button class="fab" aria-label="글쓰기"><span class="pen"></span></button>
</main>
<script>
const posts=[
['주니퍼 통화 음질 크게 별로가요?','서울T백만볼트','1','16:51','조회 3',null,0],
['프렁크 소프트 클로징~','부산T임기석','1','16:51','조회 9','https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=160&q=70',0,true],
['[뻘글] 하하하 도박 중독보다 위험하네요...','일산T와쵸스키','2','16:49','조회 57','https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=160&q=70',0],
['[뻘글] 청원완료 했네요! 5907번째 입니다.','서울T데멋대로하슈','2','16:49','조회 14','https://images.unsplash.com/photo-1601597111158-2fceff292cdc?auto=format&fit=crop&w=160&q=70',0],
['청원 완료하였습니다','용인T김군','1','16:47','조회 24','https://images.unsplash.com/photo-1601597111058-2fceff292cdc?auto=format&fit=crop&w=160&q=70',0],
['나만 쓰기 좋은 근처 노면 지수 체크해봤네요 ㅎㅎ','성남T모델삼','1','16:46','조회 33','https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=160&q=70',0],
['무슨 차 그립톡 구매 완료했는데 색상 고민이네요','수원T하이랜드','3','16:45','조회 22','https://images.unsplash.com/photo-1617469767053-d3b523a0b982?auto=format&fit=crop&w=160&q=70',1],
['FSD 숫자랑 주행 로그 나누는 나눔 합니다','파주T구름','2','16:43','조회 18',null,2],
['모닝 세차 루틴','분당T흰둥이','1','16:42','조회 6',null,5],
['링크 후기 | 나도 나눔 봤누 가보자 ㅎㅎ','송파T스노우','2','16:41','조회 44','https://images.unsplash.com/photo-1619767886558-efdc259cde1a?auto=format&fit=crop&w=160&q=70',3],
['차주 인증사진 올립니다','김포T롱레인지','1','16:40','조회 112','https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&w=160&q=70',1],
['고속도로 풍절음 잡는 팁 있을까요?','인천T초보','1','16:38','조회 75',null,4]
];
function render(){list.innerHTML=posts.map((p,i)=>{const levelClass=p[2]==='2'?'blue':'';const thumb=p[5]?`<div class="thumbWrap"><img class="thumb" src="${p[5]}">${p[7]?'<span class="play"></span>':''}</div>`:'';return `<article class="item ${p[5]?'':'noThumb'}"><span class="dot"></span><div class="body"><div class="itemTitle">${p[0]}</div><div class="meta"><span>${p[1]}</span><span class="level ${levelClass}">${p[2]}</span><span>${p[3]}</span><span>${p[4]}</span></div></div>${thumb}<div class="commentBox"><b>${p[6]}</b><span>댓글</span></div></article>`}).join('')}
render();
document.querySelectorAll('.cat').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on'));btn.classList.add('on')});
document.querySelector('.fab').onclick=()=>alert('글쓰기 화면 연결 예정');
</script>
</body>
</html>
