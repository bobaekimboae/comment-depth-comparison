<style>
:root{--red:#bd2136;--ink:#111114;--muted:#96989d;--line:#eeeeef;--green:#00a862}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}body{overflow-x:hidden}button{font:inherit;border:0;background:none;padding:0;color:inherit}.phone{width:100%;max-width:393px;margin:0 auto;background:#fff;min-height:100dvh;position:relative;overflow-x:hidden;overflow-y:visible}.appbar{height:64px;background:var(--red);color:#fff;display:flex;align-items:center;padding:0 18px 0 22px;gap:17px}.back{width:20px;height:23px;position:relative;flex:0 0 20px}.back:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg);border-radius:1px}.title{font-size:18.8px;font-weight:800;letter-spacing:-.052em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.searchIcon{width:29px;height:29px;border:2.6px solid #fff;border-radius:50%;position:relative;flex:0 0 29px}.searchIcon:after{content:"";position:absolute;width:13px;height:2.6px;background:#fff;right:-8px;bottom:0;transform:rotate(45deg);border-radius:99px}.hamburger{width:30px;height:23px;display:flex;flex-direction:column;justify-content:space-between;flex:0 0 30px}.hamburger span{height:2.8px;background:#fff;border-radius:99px}.boardTop{height:58px;display:flex;align-items:center;gap:10px;padding:0 17px;border-bottom:1px solid #f8f8f8;background:#fff}.boardPill{height:36px;border-radius:20px;background:var(--red);color:#fff;display:inline-flex;align-items:center;padding:0 14px;font-size:15.6px;font-weight:570;letter-spacing:-.043em;white-space:nowrap}.noticePill{height:36px;min-width:56px;border:1px solid #e5e6e9;border-radius:20px;background:#fff;color:#151519;padding:0 18px;font-size:15.6px;font-weight:480;box-shadow:0 1px 2px rgba(0,0,0,.025);white-space:nowrap}.subscribe{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--green);font-size:15.3px;font-weight:760;white-space:nowrap;letter-spacing:-.035em}.plus{font-size:23px;line-height:1;font-weight:420;margin-top:-2px}.gridIcon{width:23px;height:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-left:6px;flex:0 0 23px}.gridIcon span{background:#97989e;border-radius:2px}.category{height:50px;display:flex;align-items:center;gap:17px;overflow-x:auto;padding:0 17px;border-bottom:1px solid #f5f5f6;background:#fff;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.category::-webkit-scrollbar{display:none}.cat{height:34px;border-radius:20px;padding:0;color:#919296;font-size:14px;font-weight:500;letter-spacing:-.025em;white-space:nowrap;scroll-snap-align:center;flex:0 0 auto}.cat.on{background:#f3f4f6;color:#17181b;font-weight:650;padding:0 14px}.noticeRow{height:49px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);gap:9px;background:#fff}.noticeBadge{height:25px;border-radius:999px;background:#fff2f3;color:#f13f49;display:inline-flex;align-items:center;padding:0 9px;font-size:13.6px;font-weight:760;letter-spacing:-.025em}.noticeText{font-size:16.4px;font-weight:760;letter-spacing:-.045em}.list{padding-left:18px;background:#fff;touch-action:pan-y;min-height:300px}.item{min-height:86px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(46px,auto);gap:6px;align-items:center;padding:10px 17px 10px 0;position:relative;background:#fff;text-align:left;width:100%;cursor:pointer}.item.noThumb{grid-template-columns:minmax(0,1fr) minmax(46px,auto)}.dot{position:absolute;left:-9px;top:33px;width:4px;height:4px;border-radius:50%;background:#ff2f3e;display:none}.item.isFresh .dot{display:block}.body{min-width:0}.itemTitle{font-size:15.5px;line-height:21px;font-weight:440;letter-spacing:-.035em;color:#111;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{margin-top:4px;display:flex;align-items:center;gap:5px;color:#96989d;font-size:13px;font-weight:400;line-height:18px;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}.rankIcon{width:14px;height:14px;object-fit:contain;display:inline-block;flex:0 0 14px;margin-right:1px;vertical-align:-2px}.thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#edf0f4;display:block}.thumbWrap{position:relative;flex:0 0 60px;width:60px;height:60px}.photoBadge{position:absolute;right:3px;top:3px;min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:rgba(39,43,48,.62);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;line-height:1;letter-spacing:-.02em;box-shadow:0 1px 2px rgba(0,0,0,.18);backdrop-filter:blur(2px)}.play{position:absolute;left:50%;top:50%;transform:translate(-42%,-50%);width:0;height:0;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.38))}.commentBox{min-width:46px;width:auto;height:60px;padding:0 5px;border-radius:12px;background:#f6f7f9;color:#17191d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:nowrap}.commentBox b{font-size:14px;line-height:18px;font-weight:660;letter-spacing:-.015em}.commentBox[data-digits="4"] b,.commentBox[data-wide="true"] b{letter-spacing:-.25px}.commentBox span{font-size:10.5px;line-height:13px;color:#8f9197;font-weight:520;letter-spacing:-.03em}.emptyList{padding:30px 0;color:#999;font-size:14px}.fab{position:fixed;right:max(17px,calc((100vw - 393px)/2 + 17px));bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--red);box-shadow:0 8px 20px rgba(189,32,52,.28);display:grid;place-items:center;z-index:20}.writeIcon{width:28px;height:28px;display:block}.bottomSpace{height:70px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;transition:.16s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:370px){.phone{max-width:360px}.title{font-size:18px}.appbar{height:62px;gap:15px;padding-left:20px;padding-right:16px}.boardTop{gap:8px;padding:0 14px}.boardPill{font-size:15px;padding:0 12px}.noticePill{font-size:15px;padding:0 15px}.subscribe{font-size:14.8px}.category{height:50px;gap:15px;padding:0 16px}.cat{height:34px;font-size:13.7px;padding:0}.cat.on{padding:0 13px}.noticeRow{padding:0 16px}.itemTitle{font-size:15.2px;font-weight:440;line-height:20.5px}.meta{font-size:12.6px;gap:4px;margin-top:4px;line-height:17px}.rankIcon{width:14px;height:14px;flex-basis:14px}.item{grid-template-columns:minmax(0,1fr) auto minmax(46px,auto);padding-right:14px;min-height:84px;gap:6px}.item.noThumb{grid-template-columns:minmax(0,1fr) minmax(46px,auto)}.dot{left:-8px;top:32px;width:4px;height:4px}.thumb,.thumbWrap{width:58px;height:58px}.photoBadge{right:3px;top:3px;height:16px;min-width:17px;font-size:9px;padding:0 4px}.commentBox{min-width:46px;width:auto;height:58px;padding:0 5px;border-radius:12px}.commentBox b{font-size:13.8px;font-weight:660;line-height:17px}.commentBox span{font-size:10.2px;font-weight:520}.list{padding-left:16px}.fab{right:16px;width:60px;height:60px}.writeIcon{width:27px;height:27px}}
</style>

<body>
<main id="phone" class="phone">
  <header class="appbar"><button class="back" aria-label="뒤로"></button><div class="title">보배드림 자동차토론</div><button class="searchIcon" aria-label="검색"></button><button class="hamburger" aria-label="메뉴"><span></span><span></span><span></span></button></header>
  <section class="boardTop"><button class="boardPill">☰ 통합 NEWS ☰</button><button class="noticePill">공지</button><div class="subscribe"><span class="plus">＋</span><span>구독</span></div><button class="gridIcon" aria-label="보기 방식"><span></span><span></span><span></span><span></span></button></section>
  <nav id="category" class="category" aria-label="말머리 필터"></nav>
  <section class="noticeRow"><span class="noticeBadge">공지</span><span class="noticeText">리퍼럴 홍보 안내</span></section>
  <section id="list" class="list"></section>
  <div class="bottomSpace"></div>
  <button class="fab" aria-label="글쓰기"><img class="writeIcon" src="./assets/write.svg?v=220f7dd" alt=""></button>
</main>
<div id="toast" class="toast"></div>
<script src="./scenario-data.js?v=20260821c"></script>
<script src="./rank-icons-mixed.js?v=20260820c"></script>
<script src="./view-popover.js?v=20260820u"></script>
<script>
(()=>{
  function formatCommentCount(value){
    const n=Math.max(0,Number(value)||0);
    if(n<10000)return String(n);
    const man=Math.floor(n/1000)/10;
    return (Number.isInteger(man)?String(man):man.toFixed(1))+'만';
  }
  function applyCommentCountFormat(){
    const posts=Array.isArray(window.BOBAE_POSTS)?window.BOBAE_POSTS:[];
    document.querySelectorAll('.item[data-id]').forEach(item=>{
      const post=posts.find(p=>String(p.id)===String(item.dataset.id));
      if(!post)return;
      const text=formatCommentCount(post.reply);
      const box=item.querySelector('.commentBox');
      const num=box?.querySelector('b');
      if(!box||!num)return;
      num.textContent=text;
      box.dataset.digits=String(text.replace(/[^0-9]/g,'').length);
      box.dataset.wide=String(text.length>=4);
      box.setAttribute('aria-label','댓글 '+text+'개');
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',applyCommentCountFormat);else applyCommentCountFormat();
  const list=document.getElementById('list');
  if(list)new MutationObserver(applyCommentCountFormat).observe(list,{childList:true,subtree:true});
})();
</script>
</body>
