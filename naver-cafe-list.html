<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>네이버 카페 목록형 원본 재현</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{--red:#bd2136;--ink:#111114;--muted:#96989d;--line:#eeeeef;--pale:#f5f6f8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}button{font:inherit;border:0;background:none;padding:0;color:inherit}.phone{width:100%;max-width:393px;margin:0 auto;background:#fff;min-height:100dvh;position:relative;overflow:hidden}.appbar{height:72px;background:var(--red);color:#fff;display:flex;align-items:center;padding:0 18px 0 22px;gap:17px}.back{width:20px;height:23px;position:relative;flex:0 0 20px}.back:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg);border-radius:1px}.title{font-size:18.8px;font-weight:800;letter-spacing:-.052em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.searchIcon{width:29px;height:29px;border:2.6px solid #fff;border-radius:50%;position:relative;flex:0 0 29px}.searchIcon:after{content:"";position:absolute;width:13px;height:2.6px;background:#fff;right:-8px;bottom:0;transform:rotate(45deg);border-radius:99px}.hamburger{width:30px;height:23px;display:flex;flex-direction:column;justify-content:space-between;flex:0 0 30px}.hamburger span{height:2.8px;background:#fff;border-radius:99px}.boardTop{height:58px;display:flex;align-items:center;gap:12px;padding:0 17px;border-bottom:1px solid #f8f8f8;background:#fff}.boardPill{height:36px;border-radius:20px;background:var(--red);color:#fff;display:inline-flex;align-items:center;padding:0 14px;font-size:15.7px;font-weight:570;letter-spacing:-.043em;white-space:nowrap}.noticePill{height:36px;min-width:56px;border:1px solid #e5e6e9;border-radius:20px;background:#fff;color:#151519;padding:0 18px;font-size:15.7px;font-weight:480;box-shadow:0 1px 2px rgba(0,0,0,.025);white-space:nowrap}.subscribe{margin-left:auto;display:flex;align-items:center;gap:7px;color:#55575c;font-size:14.8px;font-weight:690;white-space:nowrap}.check{width:15px;height:9px;border-left:2.5px solid #686a70;border-bottom:2.5px solid #686a70;transform:rotate(-45deg);margin-top:-4px}.gridIcon{width:23px;height:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-left:7px;flex:0 0 23px}.gridIcon span{background:#97989e;border-radius:2px}.category{height:56px;display:flex;align-items:center;gap:18px;overflow-x:auto;padding:0 17px;border-bottom:1px solid #f5f5f6;background:#fff;scrollbar-width:none}.category::-webkit-scrollbar{display:none}.cat{height:37px;border-radius:20px;padding:0 15px;color:#919296;font-size:15px;font-weight:500;letter-spacing:-.03em;white-space:nowrap}.cat.on{background:#f3f4f6;color:#17181b;font-weight:650}.noticeRow{height:49px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);gap:9px;background:#fff}.noticeBadge{height:25px;border-radius:999px;background:#fff2f3;color:#f13f49;display:inline-flex;align-items:center;padding:0 9px;font-size:13.6px;font-weight:760;letter-spacing:-.025em}.noticeText{font-size:16.4px;font-weight:760;letter-spacing:-.045em}.list{padding-left:18px;background:#fff}.item{min-height:78px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto 48px;gap:8px;align-items:center;padding:12px 17px 12px 0;position:relative;background:#fff}.item.noThumb{grid-template-columns:minmax(0,1fr) 48px}.dot{position:absolute;left:-12px;top:27px;width:4.5px;height:4.5px;border-radius:50%;background:#ff2f3e}.body{min-width:0}.itemTitle{font-size:15.9px;line-height:1.36;font-weight:430;letter-spacing:-.04em;color:#111;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{margin-top:5px;display:flex;align-items:center;gap:5px;color:#96989d;font-size:13.2px;font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}.level{display:inline-flex;align-items:center;justify-content:center;min-width:14px;height:14px;border-radius:3px;background:#a86feb;color:#fff;font-size:9px;font-weight:850;line-height:1}.level.blue{background:#65a7ff}.thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#edf0f4;display:block}.thumbWrap{position:relative;flex:0 0 60px}.play{position:absolute;left:50%;top:50%;transform:translate(-42%,-50%);width:0;height:0;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.38))}.commentBox{width:48px;height:61px;border-radius:16px;background:#f6f7f9;color:#17191d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.commentBox b{font-size:15.5px;line-height:1;font-weight:740;letter-spacing:-.015em}.commentBox span{font-size:11.8px;color:#888b91;font-weight:540;letter-spacing:-.03em}.fab{position:fixed;right:max(17px,calc((100vw - 393px)/2 + 17px));bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--red);box-shadow:0 8px 20px rgba(189,32,52,.28);display:grid;place-items:center;z-index:20}.pen{width:29px;height:29px;position:relative}.pen:before{content:"";position:absolute;width:22px;height:6px;border:2.8px solid #fff;border-radius:5px;transform:rotate(-45deg);left:4px;top:6px}.pen:after{content:"";position:absolute;width:27px;height:2.8px;background:#fff;left:2px;bottom:4px;border-radius:99px}.bottomSpace{height:26px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;transition:.16s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:370px){.phone{max-width:360px}.title{font-size:18px}.appbar{height:70px;gap:15px;padding-left:20px;padding-right:16px}.boardTop{gap:9px;padding:0 14px}.boardPill{font-size:15px;padding:0 12px}.noticePill{font-size:15px;padding:0 15px}.subscribe{font-size:14.2px}.category{gap:14px;padding:0 14px}.cat{font-size:14.5px;padding:0 13px}.noticeRow{padding:0 16px}.itemTitle{font-size:15.3px;font-weight:430}.meta{font-size:12.8px}.item{grid-template-columns:minmax(0,1fr) auto 47px;padding-right:14px}.item.noThumb{grid-template-columns:minmax(0,1fr) 47px}.thumb,.thumbWrap{width:57px;height:57px}.commentBox{width:47px;height:59px}.commentBox b{font-size:15px}.commentBox span{font-size:11.5px}.list{padding-left:16px}.fab{right:16px;width:60px;height:60px}}
</style>
</head>
<body>
<main class="phone">
  <header class="appbar"><button class="back" aria-label="뒤로"></button><div class="title">테슬라코리아클럽 TKC</div><button class="searchIcon" aria-label="검색"></button><button class="hamburger" aria-label="메뉴"><span></span><span></span><span></span></button></header>
  <section class="boardTop"><button class="boardPill">☰ 자유게시판 ☰</button><button class="noticePill">공지</button><div class="subscribe"><span class="check"></span><span>구독중</span></div><button class="gridIcon" aria-label="보기 방식"><span></span><span></span><span></span><span></span></button></section>
  <nav class="category"><button class="cat on">전체</button><button class="cat">유머</button><button class="cat">뻘글</button><button class="cat">SOS</button><button class="cat">고민상담</button><button class="cat">공감구걸</button></nav>
  <section class="noticeRow"><span class="noticeBadge">공지</span><span class="noticeText">리퍼럴 홍보 안내</span></section>
  <section id="list" class="list"></section>
  <div class="bottomSpace"></div>
  <button class="fab" aria-label="글쓰기"><span class="pen"></span></button>
</main><div id="toast" class="toast"></div>
<script>
const posts=[
{title:'주니퍼 통화 음질 크게 별로가요?',user:'서울T백만볼트',lv:'1',time:'16:51',view:'조회 3',reply:0},
{title:'프렁크 소프트 클로징~',user:'부산T임기석',lv:'1',time:'16:51',view:'조회 9',reply:0,video:true,img:'https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=160&q=75'},
{title:'[뻘글] 하하하 도박 중독보다 위험하네요...',user:'일산T와쵸스키',lv:'2',time:'16:49',view:'조회 57',reply:0,img:'https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=160&q=75'},
{title:'[뻘글] 청원완료 했네요! 5907번째 입니다.',user:'서울T데멋대로하슈',lv:'2',time:'16:49',view:'조회 14',reply:0,img:'https://images.unsplash.com/photo-1601597111158-2fceff292cdc?auto=format&fit=crop&w=160&q=75'},
{title:'청원 완료하였습니다',user:'용인T김군',lv:'1',time:'16:47',view:'조회 24',reply:0,img:'https://images.unsplash.com/photo-1605810230434-7631ac76ec81?auto=format&fit=crop&w=160&q=75'},
{title:'나만 쓰기 좋은 근처 노면 지수 체크해봤네요 ㅎㅎ',user:'성남T모델삼',lv:'1',time:'16:46',view:'조회 33',reply:0,img:'https://images.unsplash.com/photo-1593941707882-a5bba14938c7?auto=format&fit=crop&w=160&q=75'},
{title:'무슨 차 그립톡 구매 완료했는데 색상 고민이네요',user:'수원T하이랜드',lv:'3',time:'16:45',view:'조회 22',reply:1,img:'https://images.unsplash.com/photo-1603386329225-868f9b1ee6c9?auto=format&fit=crop&w=160&q=75'},
{title:'FSD 숫자랑 주행 로그 나누는 나눔 합니다',user:'파주T구름',lv:'2',time:'16:43',view:'조회 18',reply:2},
{title:'모닝 세차 루틴 공유합니다',user:'분당T흰둥이',lv:'1',time:'16:42',view:'조회 6',reply:5},
{title:'링크 후기 | 나도 나눔 봤누 가보자 ㅎㅎ',user:'송파T스노우',lv:'2',time:'16:41',view:'조회 44',reply:3,img:'https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&w=160&q=75'},
{title:'차주 인증사진 올립니다',user:'김포T롱레인지',lv:'1',time:'16:40',view:'조회 112',reply:1,img:'https://images.unsplash.com/photo-1536700503339-1e4b06520771?auto=format&fit=crop&w=160&q=75'},
{title:'고속도로 풍절음 잡는 팁 있을까요?',user:'인천T초보',lv:'1',time:'16:38',view:'조회 75',reply:4},
{title:'모델Y 트렁크 매트 추천 부탁드립니다',user:'대전T패밀리',lv:'2',time:'16:36',view:'조회 52',reply:2,img:'https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=160&q=75'},
{title:'하이랜드 실내 잡소리 체크 포인트',user:'하남T화이트',lv:'1',time:'16:34',view:'조회 61',reply:10,img:'https://images.unsplash.com/photo-1609521263047-f8f205293f24?auto=format&fit=crop&w=160&q=75'}
];
function render(){list.innerHTML=posts.map(p=>{const levelClass=p.lv==='2'?'blue':'';const thumb=p.img?`<div class="thumbWrap"><img class="thumb" src="${p.img}" alt="${p.title} 썸네일">${p.video?'<span class="play"></span>':''}</div>`:'';return `<article class="item ${p.img?'':'noThumb'}"><span class="dot"></span><div class="body"><div class="itemTitle">${p.title}</div><div class="meta"><span>${p.user}</span><span class="level ${levelClass}">${p.lv}</span><span>${p.time}</span><span>${p.view}</span></div></div>${thumb}<button class="commentBox" type="button"><b>${p.reply}</b><span>댓글</span></button></article>`}).join('')}
render();
document.querySelectorAll('.cat').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on'));btn.classList.add('on');show(btn.textContent+' 선택')});
document.querySelector('.fab').onclick=()=>show('글쓰기 화면 연결 대상');
document.querySelector('.noticePill').onclick=()=>show('공지 탭');
document.querySelector('.boardPill').onclick=()=>show('자유게시판');
function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
</script>
</body>
</html>
