<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>네이버 카페 목록형 원본 재현</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{--red:#bd2136;--ink:#111114;--muted:#96989d;--line:#eeeeef;--green:#00a862}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;border:0;background:none;padding:0;color:inherit}.phone{width:100%;max-width:393px;margin:0 auto;background:#fff;min-height:100dvh;position:relative;overflow:hidden;touch-action:pan-y}.appbar{height:64px;background:var(--red);color:#fff;display:flex;align-items:center;padding:0 18px 0 22px;gap:17px}.back{width:20px;height:23px;position:relative;flex:0 0 20px}.back:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg);border-radius:1px}.title{font-size:18.8px;font-weight:800;letter-spacing:-.052em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.searchIcon{width:29px;height:29px;border:2.6px solid #fff;border-radius:50%;position:relative;flex:0 0 29px}.searchIcon:after{content:"";position:absolute;width:13px;height:2.6px;background:#fff;right:-8px;bottom:0;transform:rotate(45deg);border-radius:99px}.hamburger{width:30px;height:23px;display:flex;flex-direction:column;justify-content:space-between;flex:0 0 30px}.hamburger span{height:2.8px;background:#fff;border-radius:99px}.boardTop{height:58px;display:flex;align-items:center;gap:12px;padding:0 17px;border-bottom:1px solid #f8f8f8;background:#fff}.boardPill{height:36px;border-radius:20px;background:var(--red);color:#fff;display:inline-flex;align-items:center;padding:0 14px;font-size:15.7px;font-weight:570;letter-spacing:-.043em;white-space:nowrap}.noticePill{height:36px;min-width:56px;border:1px solid #e5e6e9;border-radius:20px;background:#fff;color:#151519;padding:0 18px;font-size:15.7px;font-weight:480;box-shadow:0 1px 2px rgba(0,0,0,.025);white-space:nowrap}.subscribe{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--green);font-size:15.3px;font-weight:760;white-space:nowrap;letter-spacing:-.035em}.plus{font-size:23px;line-height:1;font-weight:420;margin-top:-2px}.gridIcon{width:23px;height:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-left:7px;flex:0 0 23px}.gridIcon span{background:#97989e;border-radius:2px}.category{height:56px;display:flex;align-items:center;gap:18px;overflow-x:auto;padding:0 17px;border-bottom:1px solid #f5f5f6;background:#fff;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.category::-webkit-scrollbar{display:none}.cat{height:37px;border-radius:20px;padding:0 15px;color:#919296;font-size:15px;font-weight:500;letter-spacing:-.03em;white-space:nowrap;scroll-snap-align:center}.cat.on{background:#f3f4f6;color:#17181b;font-weight:650}.noticeRow{height:49px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);gap:9px;background:#fff}.noticeBadge{height:25px;border-radius:999px;background:#fff2f3;color:#f13f49;display:inline-flex;align-items:center;padding:0 9px;font-size:13.6px;font-weight:760;letter-spacing:-.025em}.noticeText{font-size:16.4px;font-weight:760;letter-spacing:-.045em}.list{padding-left:18px;background:#fff}.item{min-height:78px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto 48px;gap:8px;align-items:center;padding:12px 17px 12px 0;position:relative;background:#fff;text-align:left;width:100%;cursor:pointer}.item.noThumb{grid-template-columns:minmax(0,1fr) 48px}.dot{position:absolute;left:-8px;top:30px;width:4px;height:4px;border-radius:50%;background:#ff2f3e;display:none}.item.isFresh .dot{display:block}.body{min-width:0}.itemTitle{font-size:15.6px;line-height:1.34;font-weight:400;letter-spacing:-.04em;color:#111;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{margin-top:5px;display:flex;align-items:center;gap:4px;color:#96989d;font-size:12.9px;font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}.rankIcon{width:14px;height:14px;object-fit:contain;display:inline-block;flex:0 0 14px;margin-right:1px;vertical-align:-2px}.thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#edf0f4;display:block}.thumbWrap{position:relative;flex:0 0 60px;width:60px;height:60px}.photoBadge{position:absolute;right:3px;top:3px;min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:rgba(39,43,48,.62);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;line-height:1;letter-spacing:-.02em;box-shadow:0 1px 2px rgba(0,0,0,.18);backdrop-filter:blur(2px)}.play{position:absolute;left:50%;top:50%;transform:translate(-42%,-50%);width:0;height:0;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.38))}.commentBox{width:48px;height:61px;border-radius:16px;background:#f6f7f9;color:#17191d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.commentBox b{font-size:14.8px;line-height:1;font-weight:650;letter-spacing:-.015em}.commentBox span{font-size:11.2px;color:#8f9197;font-weight:500;letter-spacing:-.03em}.fab{position:fixed;right:max(17px,calc((100vw - 393px)/2 + 17px));bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--red);box-shadow:0 8px 20px rgba(189,32,52,.28);display:grid;place-items:center;z-index:20}.writeIcon{width:28px;height:28px;display:block}.bottomSpace{height:26px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;transition:.16s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:370px){.phone{max-width:360px}.title{font-size:18px}.appbar{height:62px;gap:15px;padding-left:20px;padding-right:16px}.boardTop{gap:9px;padding:0 14px}.boardPill{font-size:15px;padding:0 12px}.noticePill{font-size:15px;padding:0 15px}.subscribe{font-size:14.8px}.category{gap:14px;padding:0 14px}.cat{font-size:14.5px;padding:0 13px}.noticeRow{padding:0 16px}.itemTitle{font-size:15.1px;font-weight:400}.meta{font-size:12.6px;gap:4px}.rankIcon{width:14px;height:14px;flex-basis:14px}.item{grid-template-columns:minmax(0,1fr) auto 47px;padding-right:14px}.item.noThumb{grid-template-columns:minmax(0,1fr) 47px}.dot{left:-7px;top:30px;width:4px;height:4px}.thumb,.thumbWrap{width:57px;height:57px}.photoBadge{right:3px;top:3px;height:16px;min-width:17px;font-size:9px;padding:0 4px}.commentBox{width:47px;height:59px}.commentBox b{font-size:14.5px;font-weight:650}.commentBox span{font-size:11px;font-weight:500}.list{padding-left:16px}.fab{right:16px;width:60px;height:60px}.writeIcon{width:27px;height:27px}}
</style>
</head>
<body>
<main id="phone" class="phone">
  <header class="appbar"><button class="back" aria-label="뒤로"></button><div class="title">보배드림 자동차토론</div><button class="searchIcon" aria-label="검색"></button><button class="hamburger" aria-label="메뉴"><span></span><span></span><span></span></button></header>
  <section class="boardTop"><button class="boardPill">☰ 통합 NEWS ☰</button><button class="noticePill">공지</button><div class="subscribe"><span class="plus">＋</span><span>구독</span></div><button class="gridIcon" aria-label="보기 방식"><span></span><span></span><span></span><span></span></button></section>
  <nav id="category" class="category" aria-label="말머리 필터"></nav>
  <section class="noticeRow"><span class="noticeBadge">공지</span><span class="noticeText">리퍼럴 홍보 안내</span></section>
  <section id="list" class="list"></section>
  <div class="bottomSpace"></div>
  <button class="fab" aria-label="글쓰기"><img class="writeIcon" src="./assets/write.svg?v=220f7dd" alt=""></button>
</main><div id="toast" class="toast"></div>
<script src="./scenario-data.js?v=20260820e"></script>
<script src="./rank-icons-mixed.js?v=20260820c"></script>
<script>
const posts=window.BOBAE_POSTS||[];const topics=window.BOBAE_TOPICS||['전체'];let activeIndex=0;let touchStart=null;const categoryEl=document.getElementById('category');
function rankImg(p){return window.BOBAE_RANKS&&window.BOBAE_RANKS[p.rank]?`<img class="rankIcon" src="${window.BOBAE_RANKS[p.rank]}" alt="계급">`:''}
function renderTabs(){categoryEl.innerHTML=topics.map((t,i)=>`<button class="cat ${i===activeIndex?'on':''}" data-index="${i}">${t}</button>`).join('');categoryEl.querySelectorAll('.cat').forEach(btn=>btn.onclick=()=>selectTopic(Number(btn.dataset.index),true))}
function filtered(){const topic=topics[activeIndex];return topic==='전체'?posts:posts.filter(p=>p.category===topic||p.title.includes(`[${topic}]`))}
function renderList(data=filtered()){list.innerHTML=data.map(p=>{const thumb=p.thumbnail?`<div class="thumbWrap"><img class="thumb" src="${p.thumbnail}" alt="${p.title} 썸네일">${p.photos?`<span class="photoBadge">${p.photos}+</span>`:''}${p.video?'<span class="play"></span>':''}</div>`:'';return `<button class="item ${p.thumbnail?'':'noThumb'} ${p.fresh?'isFresh':''}" onclick="location.href='./naver-cafe-detail.html?id=${p.id}&v=20260820e'"><span class="dot"></span><div class="body"><div class="itemTitle">${p.title}</div><div class="meta">${rankImg(p)}<span>${p.user}</span><span>${p.time}</span><span>조회 ${p.view.toLocaleString?p.view.toLocaleString():p.view}</span></div></div>${thumb}<span class="commentBox"><b>${p.reply}</b><span>댓글</span></span></button>`}).join('')||`<div style="padding:30px 0;color:#999;font-size:14px">해당 말머리 게시물이 없습니다.</div>`}
function selectTopic(index,manual=false){activeIndex=Math.max(0,Math.min(index,topics.length-1));renderTabs();renderList();const on=categoryEl.querySelector('.cat.on');if(on)on.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});if(manual)show(topics[activeIndex]+' 선택')}
function moveTopic(dir){const next=Math.max(0,Math.min(activeIndex+dir,topics.length-1));if(next!==activeIndex)selectTopic(next,true)}
phone.addEventListener('touchstart',e=>{if(e.target.closest('.category')){touchStart=null;return}const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY}}, {passive:true});
phone.addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length)return;const t=e.changedTouches[0];const dx=t.clientX-touchStart.x;const dy=t.clientY-touchStart.y;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){moveTopic(dx<0?1:-1)}touchStart=null}, {passive:true});
renderTabs();renderList();
document.querySelector('.fab').onclick=()=>show('글쓰기 화면 연결 대상');document.querySelector('.noticePill').onclick=()=>show('공지 탭');document.querySelector('.boardPill').onclick=()=>show('통합 NEWS');
function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
</script>
</body>
</html>
